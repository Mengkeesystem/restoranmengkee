<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restaurant</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<meta name="description" content="">
<meta http-equiv="Cache-Control" content="no-cache">
<!-- 安全：只允许载入本站脚本（+ 内联），禁止外站脚本/插件/表单外送；connect 只给 Supabase（付款后台） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- config.js（店名/号码/菜单/价钱）每分钟换一次网址参数，避免浏览器沿用旧的缓存内容 -->
<script>document.write('<script src="config.js?v='+Math.floor(Date.now()/60000)+'"><\/script>');</script>
<noscript><script src="config.js"></script></noscript>
<style>
:root{--p:#B4232A;--a:#F2B417;--dk:#2A1A14;--bg:#FFFBF5;--card:#fff;--tx:#2A1A14;--mut:#7A6A60;--line:#E3D3C2;--ok:#1F8A4C;--r:3px;--rs:2px;--serif:"Noto Serif SC","Songti SC","STSong",serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
section{padding:56px 0}
h2{font-size:26px;margin:0 0 6px;color:var(--p)}
.sub{color:var(--mut);margin:0 0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:var(--rs);padding:12px 22px;font-weight:700;background:var(--p);color:#fff;text-decoration:none;min-height:44px}
.btn.alt{background:#fff;color:var(--p);border:2px solid var(--p)}
.btn.wa{background:#25D366;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(255,251,245,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;text-decoration:none;color:var(--p);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand img{height:38px;width:auto}
nav.links{display:flex;gap:4px;margin-left:auto}
nav.links a{text-decoration:none;padding:8px 10px;border-radius:var(--r);font-weight:600;font-size:15px}
nav.links a:hover{background:#F6EADB}
.hbtn{border:1px solid var(--line);background:#fff;border-radius:var(--rs);height:40px;min-width:40px;padding:0 12px;font-weight:700;position:relative}
.cartbtn{background:var(--p);color:#fff;border:0}
.cnt{position:absolute;top:-6px;right:-6px;background:var(--a);color:var(--dk);border-radius:var(--rs);font-size:12px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 5px}
.menuToggle{display:none}
@media(max-width:820px){
  nav.links{display:none;position:absolute;top:60px;left:0;right:0;background:var(--bg);flex-direction:column;padding:8px 16px 16px;border-bottom:1px solid var(--line)}
  nav.links.open{display:flex}
  .menuToggle{display:inline-block;margin-left:auto}
  .hbtn.lang{margin-left:0}
}

/* hero */
.hero{background:linear-gradient(135deg,var(--p),#7A1218);color:#fff;padding:72px 0 64px;position:relative;overflow:hidden}
.hero.img{background-size:cover;background-position:center}
.hero.img::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45)}
.hero .wrap{position:relative}
.hero h1{font-size:clamp(32px,6vw,56px);margin:0 0 8px;line-height:1.15;padding:0}
.hero h1::after{display:none}
.hero p{font-size:18px;opacity:.92;margin:0 0 22px}
.status{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);border-radius:var(--rs);padding:6px 14px;font-weight:700;margin-top:20px}
.dot{width:10px;height:10px;border-radius:50%;background:#bbb}
.dot.on{background:#4ADE80}.dot.off{background:#F87171}
.hero .acts{display:flex;flex-wrap:wrap;gap:10px}
.hero .btn.alt{background:transparent;color:#fff;border-color:#fff}

/* hero logo */
.hlogo{width:132px;height:132px;border-radius:var(--r);box-shadow:0 6px 18px rgba(0,0,0,.25);margin-bottom:16px}
@media(min-width:760px){.hlogo{width:176px;height:176px}}

/* outlets */
.region{text-align:center;color:var(--p);font-size:22px;margin:30px 0 16px;letter-spacing:2px}
.ogrp:first-child .region{margin-top:6px}
.region small{display:block;font-size:13px;color:var(--mut);letter-spacing:0;font-weight:600}
.olist{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.olist{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.olist{grid-template-columns:1fr}}
.olist.one{grid-template-columns:minmax(0,340px);justify-content:center}
.outlet{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:6px}
.outlet h3{margin:0;font-size:17px;color:var(--p)}
/* 手机：只显示前 3 间，其余按箭头展开 */
.omore{display:none}
@media(max-width:560px){
  .ogrp:not(.open) .more{display:none}
  .omore{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:16px 0 0;padding:11px 14px;background:#fff;color:var(--p);border:1px solid var(--p);border-radius:var(--r);font:inherit;font-weight:700;font-size:15px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.08)}
  .omore .arr{display:inline-block;transition:transform .2s}
  .ogrp.open .omore .arr{transform:rotate(180deg)}
}
.outlet .ln{font-size:14px;color:var(--tx)}
.outlet .ad{font-size:13.5px;color:var(--mut)}
.outlet .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.outlet .acts a{font-size:13px;padding:7px 14px;min-height:36px}

/* order type */
.otype{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.otype button{border:2px solid var(--line);background:#fff;border-radius:var(--r);padding:10px;font-weight:800;font-size:15px;min-height:46px}
.otype button.on{border-color:var(--p);background:var(--p);color:#fff}

/* payment */
.paybox{padding:12px;background:#F4FBF6;border:1px solid #CDEBD6;border-radius:var(--r)}
.paymodes{display:flex;flex-wrap:wrap;gap:8px}
.paymodes label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:var(--rs);padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;margin:0}
.paymodes label.on{border-color:var(--ok);background:#E6F6EC;color:var(--ok)}
.paymodes input[type=radio]{width:auto;margin:0;padding:0}
.paydetail{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.payamt{font-size:16px}.payamt b{font-size:20px;color:var(--p)}
.payqr{display:block;margin:0 auto;max-width:240px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#fff}
.payqr img{width:100%}
.bank{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.bank div{display:flex;align-items:center;gap:8px;padding:5px 0;flex-wrap:wrap}
.bank span{color:var(--mut);font-size:13px;min-width:70px}
.bank .accno{font-size:17px;letter-spacing:1px}
.bank .copy{padding:4px 12px;min-height:32px;font-size:13px;margin-left:auto}

/* 付款步骤 */
.paystep{position:fixed;inset:0;z-index:150;background:rgba(20,11,8,.72);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.paystep.show{display:flex}
.psbox{background:#fff;width:100%;max-width:440px;border-top:4px solid var(--a);box-shadow:6px 6px 0 rgba(0,0,0,.3);padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;border-radius:var(--r)}
.pshead{display:flex;align-items:center;justify-content:space-between;font-size:18px}
.lbx.dark{color:var(--tx);border-color:var(--line)}
.lbx.dark:hover{color:#fff}
.pssteps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pssteps li{font-size:12px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.pssteps li span{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:var(--rs);font-weight:800}
.pssteps li.on{color:var(--p)}.pssteps li.on span{border-color:var(--p);background:var(--p);color:#fff}
.pssteps li.done{color:var(--ok)}.pssteps li.done span{border-color:var(--ok);background:var(--ok);color:#fff}
.psamt{display:flex;justify-content:space-between;align-items:baseline;background:#FFF6DA;border:1px solid var(--a);padding:10px 12px;font-weight:700}
.psamt b{font-size:24px;color:var(--p)}
.psref{font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.psref b{font-size:16px;letter-spacing:1px}
.psref .copy{padding:3px 10px;min-height:30px;font-size:12px}
.psref .note{width:100%}
.psqr{display:flex;flex-direction:column;align-items:center;gap:8px}
.psqr img{width:min(260px,100%);border:1px solid var(--line)}
.psqr .btn{padding:6px 14px;min-height:36px;font-size:14px}
.pscheck{display:flex;gap:10px;align-items:center;font-weight:800;padding:10px 12px;border:2px dashed var(--ok);background:#F4FBF6;cursor:pointer}
.pscheck input{width:22px;height:22px;accent-color:var(--ok)}
.psgo{width:100%}
.psdone{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.psdone .big{font-size:44px}
.psdone h3{margin:0;color:var(--ok)}
.psdone p{margin:0;color:var(--mut)}

.pswait{display:flex;gap:12px;align-items:center;padding:12px;border:2px dashed var(--line);background:#FFFBF0;font-weight:700}
.pswait.on{border-color:var(--a)}
.pswait.bad{border-color:var(--p);background:#FDF1F1}
.pswait .note{font-weight:500;margin-top:4px}
.spin{flex:0 0 auto;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* vouchers */
.vbox{margin-bottom:18px;border-left:6px solid var(--a)}
.vbox h3{margin:0 0 4px;font-size:18px}
.vrow{display:flex;gap:8px}
.vrow input{flex:1;min-width:0;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);text-transform:uppercase;letter-spacing:1px;font-family:inherit}
.vmsg{font-size:14px;min-height:20px;margin-top:6px}
.vmsg.bad{color:var(--p)}
.vapplied{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#FFF6DA;border:1px dashed var(--a);border-radius:var(--r);padding:8px 10px;margin-top:6px;font-size:14px}
.tot.sub{font-size:15px;font-weight:600;margin:6px 0}
.tot.disc{color:var(--ok)}
.dv{margin:14px 0 6px;padding:12px;background:#FFFBF0;border:1px solid var(--line);border-radius:var(--r)}
.dvl{display:block;font-weight:800;font-size:14px;margin-bottom:6px}

/* ===== 有棱有角的整体风格 ===== */
h1,h2,.hstory h2,.region,.mname{font-family:var(--serif);letter-spacing:1px}
h2{position:relative;padding-bottom:12px;margin-bottom:12px}
h2::after{content:"";position:absolute;left:0;bottom:0;width:56px;height:3px;background:var(--a)}
#outlets h2::after{left:50%;transform:translateX(-50%)}
.btn{letter-spacing:.5px}
.item,.outlet,.promo,.mcat,.card{box-shadow:3px 3px 0 rgba(180,35,42,.10)}
.item:hover,.outlet:hover,.promo:hover{box-shadow:4px 4px 0 rgba(180,35,42,.22)}
.hero{border-bottom:5px solid var(--a)}
.hero::after{content:"";position:absolute;inset:14px;border:1px solid rgba(242,180,23,.35);pointer-events:none}
.hgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hstory{background:rgba(255,251,245,.97);color:var(--tx);padding:26px 28px;border-top:4px solid var(--a);box-shadow:6px 6px 0 rgba(0,0,0,.25);position:relative}
.hstory::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);pointer-events:none}
.hstory h2{color:var(--p);font-size:24px}
.hstory p{font-size:15.5px;margin:0 0 10px;opacity:1;line-height:1.75}
.hstory p:last-child{margin-bottom:0}
@media(max-width:860px){.hgrid{grid-template-columns:1fr;gap:28px}.hstory{padding:22px 20px}}
@media(max-width:560px){.hero::after{inset:6px}}
.promo{position:relative}
.promo .badge{position:absolute;top:0;right:0;background:var(--p);color:#fff;font-size:12px;font-weight:800;padding:4px 10px;letter-spacing:1px}
.promo .in{padding:18px 16px 16px}
.promo h3{padding-right:52px}

/* social icons */
.soc{display:flex;gap:14px;flex:0 0 auto;align-items:center}
.soc:empty{display:none}
.si{display:inline-flex;flex:0 0 auto;white-space:nowrap;align-items:center;gap:7px;text-decoration:none;color:var(--tx);font-weight:800;font-size:14px;line-height:1;min-height:36px}
.sic{width:30px;height:30px;flex:0 0 auto;display:block}
.sic svg{width:100%;height:100%;display:block}
.si:hover .sit{color:var(--p);text-decoration:underline}
.si:hover .sic{transform:translateY(-1px)}
@media(max-width:380px){.brand{font-size:15px;gap:6px}.brand img{height:34px}}
.csoc{margin-top:14px;gap:12px 24px;flex-wrap:wrap}
.csoc .si{font-size:16px}
.csoc .sic{width:38px;height:38px}


/* 页头 IG/FB（单色） */
/* 页头 FB/IG：大屏幕贴在整个画面最左边（不占 logo/菜单原本的位置，参考 Oriental Kopi）；
   屏幕不够宽时退回 logo 左边、只显示图标 */
.tsoc{display:flex;align-items:center;gap:10px;margin-right:12px;flex:0 1 auto;min-width:0}
.tsoc:empty{display:none}
.tsoc:not(:empty)+.brand{padding-left:12px;border-left:1px solid var(--line)}
.ts{display:inline-flex;align-items:center;gap:6px;color:var(--p);text-decoration:none;font-weight:800;font-size:14px;white-space:nowrap}
.ts svg{width:22px;height:22px;flex:0 0 auto}
.ts span{display:none}
.ts:hover span{text-decoration:underline}
@media(min-width:1260px){
  .tsoc{position:absolute;left:24px;top:0;height:60px;margin:0;gap:14px}
  .tsoc:not(:empty)+.brand{padding-left:0;border-left:0}
}
@media(min-width:1720px){.ts span{display:inline}.tsoc{gap:22px}}
@media(max-width:400px){.tsoc{gap:8px;margin-right:8px}.tsoc:not(:empty)+.brand{padding-left:8px}.ts svg{width:20px;height:20px}}
@media(max-width:480px){.brand img+span{display:none}}

/* promos */
.promos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.promo{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);border-left:6px solid var(--a)}
.promo img{width:100%;aspect-ratio:16/9;object-fit:cover}
.promo .in{padding:16px}
.promo h3{margin:0 0 6px;font-size:18px}
.promo .dt{color:var(--mut);font-size:13px;margin-top:8px}

/* menu */
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;position:sticky;top:60px;background:var(--bg);z-index:5;padding-top:8px;-ms-overflow-style:none;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:var(--rs);padding:8px 16px;font-weight:700;min-height:40px}
.cats button.on{background:#FFF0D0;color:var(--p);border-color:var(--a)}
.mcat{margin:0 0 10px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mcat.open{padding:0 14px 14px}
.mcat.open .mhead{margin:0 -14px;width:calc(100% + 28px);border-bottom:1px solid var(--line)}
.mhead{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:0;padding:14px 16px;text-align:left;min-height:56px;color:var(--tx)}
.mhead:hover{background:#FFF8EE}
.mname{flex:1;font-size:18px;font-weight:800;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mname small{font-size:13px;color:var(--mut);font-weight:600}
.incart{background:var(--a);color:var(--dk);font-size:12px;font-weight:800;padding:3px 10px;border-radius:var(--rs);white-space:nowrap}
.chev{width:32px;height:32px;border-radius:var(--rs);background:#F6EADB;color:var(--p);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex:0 0 auto}
.mcat.open .chev{background:var(--p);color:#fff}
.mcat .grid{margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;align-items:start}
.item{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;background:#F6EADB;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;left:10px;background:var(--a);color:var(--dk);font-size:12px;font-weight:800;padding:3px 10px;border-radius:var(--rs)}
.so{position:absolute;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--p);font-size:20px}
.item .in{padding:12px 14px 14px;display:flex;flex-direction:column;flex:1}
.item h4{margin:0;font-size:16px}
.item .en{color:var(--mut);font-size:13px}
.item .ds{color:var(--mut);font-size:13px;margin-top:4px}
.item .ft{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px}
.price{font-weight:800;font-size:17px;color:var(--p)}
.price small{font-size:12px;color:var(--mut);font-weight:700}
.ft .price{display:flex;flex-direction:column;line-height:1.25}
.item .ft{gap:8px;flex-wrap:wrap}
@media(max-width:380px){.item .ph,.item.noimg .ph{width:88px;min-width:88px;min-height:96px}.qty{gap:6px}.qty button{width:32px;height:32px;font-size:18px}.item .in{padding:9px 10px}}
.price .amt{white-space:nowrap}
.price .nosst{font-size:10.5px;font-weight:600;color:var(--mut);white-space:nowrap}
.code{position:absolute;bottom:8px;right:8px;background:rgba(139,0,0,.88);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:var(--rs)}
.sizes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sizes button{border:1px solid var(--line);background:#fff;border-radius:var(--rs);padding:5px 11px;font-size:13px;min-height:34px;color:var(--tx)}
.sizes button b{color:var(--p)}
.sizes button.on{background:var(--p);border-color:var(--p);color:#fff}
.sizes button.on b{color:#fff}
.optsel{margin-top:8px;width:100%;font-size:16px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff;color:var(--tx);font-family:inherit}
/* 菜品卡：所有屏幕都用「左图右文」紧凑横排，桌面两~三栏 */
.mcat .grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:stretch}
.item{flex-direction:row}
.item .ph,.item.noimg .ph{aspect-ratio:auto;width:120px;min-width:120px;height:auto;min-height:120px;font-size:30px}
.item .ph img{position:absolute;inset:0}
.item .in{padding:10px 12px}
.tag{top:6px;left:6px;font-size:11px;padding:2px 7px}
.code{bottom:6px;right:6px}
@media(max-width:560px){
  .mcat .grid{grid-template-columns:1fr;gap:10px}
  .item .ph,.item.noimg .ph{width:104px;min-width:104px;min-height:104px}
}

function slotsFor(dateStr, step, leadMin, lastGap){
  const d = parseYmd(dateStr), segs = hoursOf(d.getDay()); if(!segs) return [];
  const now = new Date(), isToday = ymd(now)===dateStr;
  const minNow = now.getHours()*60+now.getMinutes()+leadMin;
  const out = [];
  segs.forEach(([a,b])=>{
    const s=toMin(a), e=toMin(b)-lastGap;
    for(let m=Math.ceil(s/step)*step; m<=e; m+=step){ if(!isToday || m>=minNow) out.push(fromMin(m)); }
  });
  return out;
}
function openState(){
  const now=new Date(), m=now.getHours()*60+now.getMinutes(), segs=hoursOf(now.getDay());
  if(segs){ for(const [a,b] of segs){ if(m>=toMin(a)&&m<toMin(b)) return {open:true,until:b}; } }
  for(let i=0;i<8;i++){
    const d=new Date(now); d.setDate(now.getDate()+i); const sg=hoursOf(d.getDay()); if(!sg) continue;
    for(const [a] of sg){ if(i>0 || toMin(a)>m) return {open:false,next:(i===0?"":t("days")[d.getDay()]+" ")+a}; }
  }
  return {open:false};
}

/* ---------- 购物车 ---------- */
/* 每道菜可有多个份量(prices)和做法(options)；购物车每一行的 key = 菜id|份量序号|做法序号 */
const allItems = Object.create(null);   /* 无原型：localStorage 里的 "__proto__"/"constructor" 之类 id 查不到东西 */
(S.menu||[]).forEach(c=>(c.items||[]).forEach(it=>{allItems[it.id]=it;}));
const canOrder = it => !it.soldOut && !it.seasonal;
const sizeNames = (it,lg) => { const n=(it.prices||[]).length; const zh=it.sizes||(n===2?["小","大"]:n===3?["小","中","大"]:n===4?["小","中","大","特大"]:[]); const en=it.sizesEn||(n===2?["S","L"]:n===3?["S","M","L"]:n===4?["S","M","L","XL"]:[]); return (lg||lang)==="en"?en:zh; };
const unitPrice = (it,si) => it.prices ? it.prices[si] : it.price;
const parseKey = k => { const [id,si,oi]=k.split("|"); return {it:allItems[id], si:+si||0, oi:+oi||0}; };
const keyOf = (id,si,oi) => id+"|"+(si||0)+"|"+(oi||0);
let cart = store.get("site_cart",{});
/* localStorage 可被改：只留「格式完全标准」的 key（菜id|整数|整数，跟 keyOf 产生的一模一样）和 1–99 的整数数量，其余一律丢掉。
   这样 key 里不可能夹带引号/HTML，后面拼进 onclick 也安全。 */
if(!cart||typeof cart!=="object"||Array.isArray(cart)) cart={};
cart=Object.keys(cart).reduce((c,k)=>{ const {it,si,oi}=parseKey(k), q=cart[k];
  if(it&&canOrder(it)&&k===keyOf(it.id,si,oi)&&/^[\w-]+$/.test(it.id)&&Number.isInteger(q)&&q>=1&&q<=99&&(it.prices?si<it.prices.length:si===0)&&(it.options?oi<it.options.length:oi===0)) c[k]=q;
  return c; },{});
const pick = {};   /* 卡片上目前选的份量/做法 */
const curPick = it => pick[it.id] || (pick[it.id]={si:0,oi:0});
const saveCart = () => store.set("site_cart",cart);
const cartCount = () => Object.values(cart).reduce((a,b)=>a+b,0);
const cartTotal = () => Object.entries(cart).reduce((s,[k,q])=>{const {it,si}=parseKey(k);return s+(it?unitPrice(it,si)*q:0);},0);
function lineLabel(k, forWa){
  const {it,si,oi}=parseKey(k), parts=[];
  if(it.prices) parts.push(sizeNames(it, forWa?"zh":lang)[si]);
  if(it.options) parts.push(it.options[oi]);
  return parts.length?" ("+parts.join(", ")+")":"";
}
function stepKey(k,d){
  const {it}=parseKey(k); if(!it||!canOrder(it)) return;
  const min=it.min||1, cur=cart[k]||0;
  let q = d>0 ? (cur===0?Math.max(min,1):cur+1) : (cur-1<min?0:cur-1);
  if(q<=0) delete cart[k]; else cart[k]=Math.min(q,99);
  saveCart(); refreshCart();
  if(d>0) toast(t("added")+" ✓"+(cur===0&&min>1?" ×"+min:""));
}
window.__site = {
  add:(id,d)=>{ const it=allItems[id]; if(!it) return; const p=curPick(it); stepKey(keyOf(id,p.si,p.oi),d); },
  step:(k,d)=>stepKey(k,d),
  vRemove:()=>removeVoucher(),
  lb:(i)=>lbShow(i), lbClose:()=>lbClose(), lbGo:(d)=>lbGo(d),
  mslide:(d)=>{ const tr=$("mtrack"); if(!tr) return; const n=menuPhotos().length; const i=(Math.round(tr.scrollLeft/tr.clientWidth)+d+n)%n; tr.scrollTo({left:i*tr.clientWidth,behavior:"smooth"}); },
  cat:(i)=>{ if(openCats.has(i)) openCats.delete(i); else openCats.add(i); renderMenu(); if(openCats.has(i)){ const el=$("cat-"+i); const top=el.getBoundingClientRect().top; if(top<110||top>window.innerHeight-80) window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-120,behavior:"smooth"}); } },
  otype:(v)=>{ orderType=(v==="delivery"&&DEL())?"delivery":"pickup"; store.set("site_otype",orderType); refreshCart(); },
  pay:(m)=>{ payMode=m; const oi=$("od_outlet")?$("od_outlet").value:undefined; $("payBox").innerHTML=payBoxHTML(oi); if($("od_send")) $("od_send").innerHTML=sendLabel(oi); },
  psClose:()=>closePayStep(), psCheck:(v)=>{ $("psSend").disabled=!v; }, psSend:()=>payStepSend(), psDone:()=>payStepDone(), psResend:()=>{ if(payPending) openWa(payPending.msg,payPending.oi); },
  copy:(txt)=>{ const done=()=>toast(t("copied")+" ✓"); try{ navigator.clipboard.writeText(txt.replace(/\s|-/g,"")).then(done,()=>prompt(t("copy"),txt)); }catch(e){ prompt(t("copy"),txt); } },
  size:(id,si)=>{ curPick(allItems[id]).si=+si; renderMenu(); },
  opt:(id,oi)=>{ curPick(allItems[id]).oi=+oi; renderMenu(); },
};

/* ---------- 优惠码 ----------
 * config.js 里只放 SHA-256(盐+大写码) 的哈希，原码不出现在网页源码。
 * 静态网站无法限制使用次数：讯息里带上优惠码，由店员核对。 */
const VSALT = "mk-voucher:";
const vouchers = () => Array.isArray(S.vouchers)?S.vouchers:[];
const vActive = v => { const d=ymd(new Date()); return (!v.from||v.from<=d)&&(!v.to||v.to>=d); };
const vouchersOn = () => vouchers().some(vActive) && !!(S.ordering&&S.ordering.enabled);
const vInPromos = () => vouchersOn() && !!(S.ordering&&S.ordering.voucherInPromos);   /* 优惠活动区块也显示兑换框（默认只在购物车） */
let voucher = null;   /* {code, v} */
async function sha256(txt){
  if(!(window.crypto&&crypto.subtle)) throw new Error("no-crypto");
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function findVoucher(code){
  const c=String(code||"").trim().toUpperCase(); if(!c) return null;
  const h=await sha256(VSALT+c); const v=vouchers().find(x=>x.hash===h);
  return v?{code:c,v}:{code:c,v:null};
}
function vDiscount(sub){
  if(!voucher||!voucher.v) return 0; const v=voucher.v;
  if(!vActive(v)||sub<(v.minSpend||0)) return 0;
  let off = v.type==="percent" ? sub*(v.value||0)/100 : v.type==="amount" ? (v.value||0) : 0;
  if(v.maxOff) off=Math.min(off,v.maxOff);
  return Math.round(Math.min(off,sub)*100)/100;
}
const vDesc = v => L(v,"title") || (v.type==="percent"?`${v.value}% off`:v.type==="amount"?`-${money(v.value)}`:"");
/* ---------- 自取 / 外卖 ---------- */
const DEL = () => (S.ordering&&S.ordering.delivery&&S.ordering.delivery.enabled) ? S.ordering.delivery : null;
let orderType = store.get("site_otype","pickup"); if(orderType!=="delivery"||!DEL()) orderType="pickup";
let delZone = String(store.get("site_zone","")); if(!/^\d{1,2}$/.test(delZone)) delZone="";
const isDel = () => orderType==="delivery" && !!DEL();
const delZoneObj = () => { const d=DEL(); return d&&delZone!==""?(d.zones||[])[+delZone]:null; };
function delFee(){
  if(!isDel()) return 0; const d=DEL(), z=delZoneObj(); if(!z) return 0;
  const net=cartTotal()-vDiscount(cartTotal());
  return d.freeAbove&&net>=d.freeAbove ? 0 : (z.fee||0);
}
/* SST：按（食物小计 − 优惠）计算，运费不收 SST。税率在 config.js 的 ordering.sstRate */
const sstRate = () => +(S.ordering&&S.ordering.sstRate)||0;
const sstAmt = () => { const sub=cartTotal(); return Math.round((sub-vDiscount(sub))*sstRate()*100)/100; };
const sstLabel = () => `SST ${Math.round(sstRate()*1000)/10}%`;
const finalTotal = () => { const sub=cartTotal(); return Math.round((sub-vDiscount(sub)+sstAmt()+delFee())*100)/100; };
function waTotalLines(){
  const sub=cartTotal(), d=vDiscount(sub), out=[];
  if(voucher||sstRate()||isDel()) out.push(`${t("subtotal")}: ${money(sub)}`);
  if(voucher) out.push(`${t("vCodeLbl")}: ${voucher.code} (${vDesc(voucher.v)})${d>0?" −"+money(d):""}${voucher.v.type==="gift"&&voucher.v.gift?" · "+voucher.v.gift:""}${sub<(voucher.v.minSpend||0)?" ⚠️ "+t("vNotMet"):""}`);
  if(sstRate()) out.push(`${sstLabel()}: ${money(sstAmt())}`);
  if(isDel()) out.push(`${t("delFee")}: ${delFee()===0?t("free"):money(delFee())} (${delZoneObj().label})`);
  out.push(`${t("total")}: ${money(finalTotal())}`);
  return out;
}
async function applyVoucher(code, quiet){
  const msgEl=$("vMsg");
  try{
    const r=await findVoucher(code);
    if(!r){ if(msgEl) msgEl.textContent=""; return; }
    if(!r.v||!vActive(r.v)){ if(!quiet&&msgEl){msgEl.className="vmsg bad";msgEl.textContent=t(r.v?"vExpired":"vInvalid");} if(quiet){voucher=null;store.set("site_voucher","");} return; }
    voucher=r; store.set("site_voucher",r.code);
    if(!quiet){ toast(t("vApplied")+" ✓"); }
  }catch(e){ if(msgEl){msgEl.className="vmsg bad";msgEl.textContent=t("vError");} }
  renderVoucherBox(); refreshCart();
}

function dateOptions(minAhead,maxAhead,sel,step,lead,gap){
  const out=[], now=new Date();
  for(let i=minAhead;i<=maxAhead;i++){
    const d=new Date(now); d.setDate(now.getDate()+i); const s=ymd(d);
    if(!slotsFor(s,step,lead,gap).length) continue;
    out.push(`<option value="${s}" ${s===sel?"selected":""}>${s} ${t("days")[d.getDay()]}</option>`);
  }
  return out;
}
function timeOptions(date,step,lead,gap,sel){
  const sl = date ? slotsFor(date,step,lead,gap) : [];
  return sl.length ? sl.map(s=>`<option ${s===sel?"selected":""}>${s}</option>`).join("") : `<option value="">${esc(t("noSlot"))}</option>`;
}

function payInfo(oi){
  const o = (oi!==undefined&&oi!==""&&outlets()[+oi]) || null;
  if(PAY_TEST && !(S.payment&&(S.payment.qr||S.payment.accountNo))) return {qr:"images/test-tng-qr.jpg",allowPayAtCounter:true,note:"🧪 测试模式：Touch 'n Go eWallet（CHONG YOU XIAN）。付款后勾选「我已完成付款」，订单会发到 WhatsApp。"};
  const p = Object.assign({}, S.payment||{}, (o&&o.payment)||{});
  return (p.qr||p.accountNo) ? p : null;
}
function sendLabel(oi){ return payInfo(oi)&&payMode==="now" ? `💳 ${esc(t("checkoutPay"))}` : `💬 ${esc(t("checkout"))}`; }
const bankHTML = p => !p.accountNo?"":`<div class="bank">
  ${p.bankName?`<div><span>${esc(t("payBank"))}</span><b>${esc(p.bankName)}</b></div>`:""}
  ${p.accountName?`<div><span>${esc(t("payAccName"))}</span><b>${esc(p.accountName)}</b></div>`:""}
  <div><span>${esc(t("payAccNo"))}</span><b class="accno">${esc(p.accountNo)}</b><button type="button" class="btn alt copy" onclick="__site.copy('${esc(String(p.accountNo).replace(/[^\d\s-]/g,""))}')">${esc(t("copy"))}</button></div>
</div>`;
/* ---------- 付款步骤：下单 → 显示 QR/户口 + 金额 + 参考号 → 客人付款 → 勾「我已付款」→ 自动打开 WhatsApp 发订单 ----------
 * 没接付款网关，「付款成功」由客人确认，店员凭 WhatsApp 收据截图核对。 */
let payPending=null;
function genRef(){ const d=new Date(); return "MK"+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+String(Math.floor(1000+Math.random()*9000)); }
/* 小后台（Supabase）：有设定 config.js 的 backend 时，「付款成功」改由店员在 admin.html 确认，
   客人网页自动轮询，确认后自动跳 WhatsApp；没设定就用「客人自己勾选」的旧流程。 */
const PB = () => { const b=S.backend||{}; return b.supabaseUrl&&b.supabaseAnonKey ? b : null; };
async function pbRpc(fn, args){
  const b=PB(), r=await fetch(b.supabaseUrl.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:b.supabaseAnonKey,Authorization:"Bearer "+b.supabaseAnonKey,"Content-Type":"application/json"},body:JSON.stringify(args)});
  if(!r.ok) throw new Error(await r.text()); return r.json();
}
function openPayStep(oi, buildMsg, meta){
  payPending={oi, buildMsg, meta:meta||{}, ref:genRef(), amount:finalTotal(), sent:false, auto:!!PB(), st:PB()?"creating":"manual"};
  renderPayStep(); $("paystep").classList.add("show");
  if(payPending.auto) startAutoPay();
}
async function startAutoPay(){
  const P=payPending; if(!P) return;
  P.msg=P.buildMsg(`${t("payMethod")}: ${t("payAutoWa").replace("{x}",money(P.amount))} · ${t("psRef")} ${P.ref}`);
  for(let i=0;i<3;i++){
    try{
      P.token = await pbRpc("create_web_order",{p_ref:P.ref,p_outlet:P.meta.outlet||"",p_type:P.meta.type||"",p_name:P.meta.name||"",p_phone:P.meta.phone||"",p_amount:P.amount,p_message:P.msg});
      break;
    }catch(e){
      if(/duplicate|unique/i.test(String(e.message))&&i<2){ P.ref=genRef(); P.msg=P.buildMsg(`${t("payMethod")}: ${t("payAutoWa").replace("{x}",money(P.amount))} · ${t("psRef")} ${P.ref}`); continue; }
      if(payPending!==P) return;
      P.auto=false; P.st="manual"; renderPayStep(); return;   /* 后台连不上 → 退回客人自己勾选 */
    }
  }
  if(payPending!==P) return;
  P.st="waiting"; P.since=Date.now(); renderPayStep();
  const tick=async()=>{
    if(payPending!==P||P.st!=="waiting") return;
    try{
      const st=await pbRpc("web_order_status",{p_ref:P.ref,p_token:P.token});
      if(payPending!==P) return;
      if(st==="paid"){ stopAutoPay(P); P.st="paid"; P.sent=true; renderPayStep(); setTimeout(()=>{ if(payPending===P) window.location.href=waLink(P.msg,P.oi); },900); return; }
      if(st==="rejected"){ stopAutoPay(P); P.st="rejected"; renderPayStep(); return; }
    }catch(e){}
    if(Date.now()-P.since>30*60*1000){ stopAutoPay(P); P.st="timeout"; renderPayStep(); }
  };
  P.timer=setInterval(tick,3000);
  P.onVis=()=>{ if(document.visibilityState==="visible") tick(); };
  document.addEventListener("visibilitychange",P.onVis);
}
function stopAutoPay(P){ if(P&&P.timer){ clearInterval(P.timer); P.timer=null; } if(P&&P.onVis){ document.removeEventListener("visibilitychange",P.onVis); P.onVis=null; } }
function closePayStep(force){
  const P=payPending;
  if(!force&&P&&P.st==="waiting"&&!confirm(t("psLeaveWarn"))) return;
  stopAutoPay(P); $("paystep").classList.remove("show"); $("paystep").innerHTML=""; payPending=null;
}
function renderPayStep(){
  const P=payPending; if(!P) return; const p=payInfo(P.oi)||{};
  const steps=[t("psStep1"),t("psStep2"),t("psStep3")], cur=P.sent?4:2;
  $("paystep").innerHTML=`<div class="psbox" role="dialog" aria-modal="true">
    <div class="pshead"><b>💳 ${esc(t("psTitle"))}</b><button type="button" class="lbx dark" onclick="__site.psClose()" aria-label="close">✕</button></div>
    <ol class="pssteps">${steps.map((x,i)=>`<li class="${i+1<cur?"done":i+1===cur?"on":""}"><span>${i+1<cur?"✓":i+1}</span>${esc(x)}</li>`).join("")}</ol>
    ${!P.sent?`
      <div class="psamt">${esc(t("payAmount"))}<b>${money(P.amount)}</b></div>
      <div class="psref">${esc(t("psRef"))} <b>${esc(P.ref)}</b> <button type="button" class="btn alt copy" onclick="__site.copy('${esc(P.ref)}')">${esc(t("copy"))}</button><div class="note">${esc(t("psRefHint"))}</div></div>
      ${p.qr?`<div class="psqr"><img src="${esc(p.qr)}" alt="DuitNow QR"><a class="btn alt" href="${esc(p.qr)}" download>⬇ ${esc(t("psSaveQr"))}</a><div class="note">${esc(t("payQrHint"))}</div></div>`:""}
      ${bankHTML(p)}
      ${!P.auto?`<label class="pscheck"><input type="checkbox" id="psChk" onchange="__site.psCheck(this.checked)"> ${esc(t("psPaid").replace("{x}",money(P.amount)))}</label>
      <button type="button" class="btn wa psgo" id="psSend" disabled onclick="__site.psSend()">💬 ${esc(t("psSend"))}</button>
      <div class="note">${esc(L(p,"note")||t("psAfter"))}</div>`
      : P.st==="creating"?`<div class="pswait"><span class="spin"></span>${esc(t("psCreating"))}</div>`
      : P.st==="waiting"?`<div class="pswait on"><span class="spin"></span><div><b>${esc(t("psWaitT"))}</b><div class="note">${esc(t("psWaitB"))}</div></div></div>`
      : `<div class="pswait bad"><div><b>${esc(t(P.st==="rejected"?"psRejT":"psTimeoutT"))}</b><div class="note">${esc(t("psContact"))}</div></div></div>
         <a class="btn wa psgo" href="${esc(waLink(t("psHelpMsg").replace("{r}",P.ref).replace("{x}",money(P.amount)),P.oi))}" target="_blank" rel="noopener">💬 ${esc(t("psContactBtn"))}</a>`}`
    :`<div class="psdone"><div class="big">✅</div><h3>${esc(t(P.auto?"psPaidT":"psSentT"))}</h3><p>${esc(t(P.auto?"psPaidB":"psSentB"))}</p>
      <button type="button" class="btn ${P.auto?"wa":"alt"}" onclick="__site.psResend()">💬 ${esc(t(P.auto?"psOpenWa":"psReopen"))}</button>
      <button type="button" class="btn" onclick="__site.psDone()">${esc(t("psFinish"))}</button></div>`}
  </div>`;
}
function payStepSend(){
  const P=payPending; if(!P||!$("psChk")||!$("psChk").checked) return;
  P.msg=P.buildMsg(`${t("payMethod")}: ${t("payNowWa").replace("{x}",money(P.amount))} · ${t("psRef")} ${P.ref}`);
  openWa(P.msg, P.oi); P.sent=true; renderPayStep();
}
function payStepDone(){ cart={}; saveCart(); closePayStep(true); if(drawerOpen) closeDrawer(); refreshCart(); toast(t("psThanks")); }
function payBoxHTML(oi){
  const p=payInfo(oi); if(!p) return "";
  const counterOK = p.allowPayAtCounter!==false;
  if(payMode===null || (!counterOK && payMode==="counter")) payMode = p.defaultMode==="counter"&&counterOK ? "counter" : "now";
  const amt = money(finalTotal());
  return `<div class="paybox"><label class="dvl">💳 ${esc(t("payTitle"))}</label>
    <div class="paymodes">
      <label class="${payMode==="now"?"on":""}"><input type="radio" name="paymode" value="now" ${payMode==="now"?"checked":""} onchange="__site.pay('now')"> ${esc(t("payNow"))}</label>
      ${counterOK?`<label class="${payMode==="counter"?"on":""}"><input type="radio" name="paymode" value="counter" ${payMode==="counter"?"checked":""} onchange="__site.pay('counter')"> ${esc(t(isDel()?"payCod":"payCounter"))}</label>`:""}
    </div>
    ${payMode==="now"?`<div class="paydetail">
      <div class="payamt">${esc(t("payAmount"))} <b>${amt}</b></div>
      <div class="note">${esc(t("payNextHint"))}</div>
    </div>`:`<div class="note" style="margin-top:6px">${esc(t(isDel()?"payCodHint":"payCounterHint"))}</div>`}
  </div>`;
}
function openDrawer(){ drawerOpen=true; renderDrawer(); $("drawer").classList.add("show"); $("ov").classList.add("show"); document.body.style.overflow="hidden"; refreshCartFab(); }
function closeDrawer(){ drawerOpen=false; $("drawer").classList.remove("show"); $("ov").classList.remove("show"); document.body.style.overflow=""; refreshCartFab(); }
function refreshCartFab(){ $("fab").classList.toggle("show", cartCount()>0 && !drawerOpen && !!(S.ordering&&S.ordering.enabled)); }

(async()=>{ const c=store.get("site_voucher",""); if(c) await applyVoucher(c,true); })();
function renderAll(){ renderHeader(); renderHero(); renderOutlets(); renderMenuPhotos(); renderPromos(); refreshCart(); renderBooking(); renderAbout(); renderContact(); }

/* ---------- 事件 ---------- */
if(S.theme){ const r=document.documentElement.style; if(S.theme.primary) r.setProperty("--p",S.theme.primary); if(S.theme.accent) r.setProperty("--a",S.theme.accent); if(S.theme.dark) r.setProperty("--dk",S.theme.dark); }
$("langBtn").onclick=()=>{lang=lang==="en"?"zh":"en";store.set("site_lang",lang);renderAll();};
$("cartBtn").onclick=openDrawer; $("fab").onclick=openDrawer; $("ov").onclick=closeDrawer;
$("menuToggle").onclick=()=>$("nav").classList.toggle("open");
$("nav").addEventListener("click",e=>{ if(e.target.tagName==="A") $("nav").classList.remove("open"); });
document.addEventListener("keydown",e=>{ if(payPending&&e.key==="Escape"){ closePayStep(); return; } if(lbOpen){ if(e.key==="Escape") lbClose(); else if(e.key==="ArrowRight") lbGo(1); else if(e.key==="ArrowLeft") lbGo(-1); return; } if(e.key==="Escape"&&drawerOpen) closeDrawer(); });
setInterval(renderHero,60000);
renderAll();
})();
</script>
</body>
