<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>明记家乡小食店 Meng Kee Restaurant</title>

<meta property="og:type" content="website">

<meta property="og:image" content="https://restoranmengkee.com.my/images/logo.png">
<meta property="og:image:width" content="512"><meta property="og:image:height" content="512">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<meta name="description" content="明记家乡小食店：家乡的味道，一锅一铲炒出来。网上点餐自取／外送、订位、11 间分店地址。">
<meta http-equiv="Cache-Control" content="no-cache">
<!-- 安全：只允许载入本站脚本（+ 内联），禁止外站脚本/插件/表单外送；connect 只给 Supabase（付款后台） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; worker-src blob:; connect-src 'self' https://*.supabase.co https://nominatim.openstreetmap.org https://*.googleapis.com https://*.google.com; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- config.js（店名/号码/菜单/价钱）每分钟换一次网址参数，避免浏览器沿用旧的缓存内容 -->
<script>document.write('<script src="config.js?v='+Math.floor(Date.now()/60000)+'"><\/script><script src="geo.js?v='+Math.floor(Date.now()/60000)+'"><\/script>');</script>
<noscript><script src="config.js"></script></noscript>
<style>
:root{--p:#B4232A;--a:#F2B417;--dk:#2A1A14;--bg:#FFFBF5;--card:#fff;--tx:#2A1A14;--mut:#7A6A60;--line:#E3D3C2;--ok:#1F8A4C;--r:3px;--rs:2px;--serif:"Noto Serif SC","Songti SC","STSong",serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
section{padding:56px 0}
h2{font-size:26px;margin:0 0 6px;color:var(--p)}
.sub{color:var(--mut);margin:0 0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:var(--rs);padding:12px 22px;font-weight:700;background:var(--p);color:#fff;text-decoration:none;min-height:44px}
.btn.alt{background:#fff;color:var(--p);border:2px solid var(--p)}
.btn.wa{background:#25D366;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(255,251,245,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;text-decoration:none;color:var(--p);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand img{height:38px;width:auto}
nav.links{display:flex;gap:4px;margin-left:auto}
nav.links a{text-decoration:none;padding:8px 10px;border-radius:var(--r);font-weight:600;font-size:15px}
nav.links a:hover{background:#F6EADB}
.hbtn{border:1px solid var(--line);background:#fff;border-radius:var(--rs);height:40px;min-width:40px;padding:0 12px;font-weight:700;position:relative}
.cartbtn{background:var(--p);color:#fff;border:0}
.cnt{position:absolute;top:-6px;right:-6px;background:var(--a);color:var(--dk);border-radius:var(--rs);font-size:12px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 5px}
.menuToggle{display:none}
@media(max-width:820px){
  nav.links{display:none;position:absolute;top:60px;left:0;right:0;background:var(--bg);flex-direction:column;padding:8px 16px 16px;border-bottom:1px solid var(--line)}
  nav.links.open{display:flex}
  .menuToggle{display:inline-block;margin-left:auto}
  .hbtn.lang{margin-left:0}
}

/* hero */
.hero{background:linear-gradient(135deg,var(--p),#7A1218);color:#fff;padding:72px 0 64px;position:relative;overflow:hidden}
.hero.img{isolation:isolate}
.hero .hbg{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center;opacity:0}
.hero .hbg.in{animation:hbgIn 2.5s ease-in-out forwards}
@keyframes hbgIn{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:none}}
@media (prefers-reduced-motion:reduce){.hero .hbg.in{animation:none;opacity:1}.hero.img.hbgin::after{animation:none;opacity:1}}
/* 2026-10-26 业主：招牌已高清化，不再模糊；左边字的区域暗一点、右边让招牌看得清楚 */
.hero.img::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(30,8,6,.82) 0%,rgba(30,8,6,.55) 45%,rgba(30,8,6,.22) 100%)}
@media(max-width:760px){.hero.img::before{background:rgba(30,8,6,.62)}}
/* 手机版首页紧凑（2026-10-28 业主：红色背景不要占大半个屏幕）：logo 在左、店名+标语在右；按钮、营业灯变小 */
@media(max-width:760px){
  .hero{padding:22px 0 22px}
  .hhead{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .hhead .hlogo{width:84px;height:84px;margin:0;flex:none}
  .hhead h1{font-size:25px;margin:0 0 4px}
  .hhead p{font-size:14px;margin:0}
  .hero .acts{flex-wrap:nowrap;gap:8px}
  .hero .acts .btn{flex:1 1 0;min-width:0;padding:6px 4px;font-size:14px;min-height:40px;line-height:1.2;text-align:center;letter-spacing:0;gap:4px}
  .hero .status{font-size:13px;padding:4px 10px;margin-top:12px;gap:6px}
  .hero .status.delst{margin-top:6px}
  .hero .dot{width:8px;height:8px}
}
.hero .wrap{position:relative}
.hero h1{font-size:clamp(32px,6vw,56px);margin:0 0 8px;line-height:1.15;padding:0}
.hero h1::after{display:none}
.hero p{font-size:18px;opacity:.92;margin:0 0 22px}
.status{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);border-radius:var(--rs);padding:6px 14px;font-weight:700;margin-top:20px}
.status.delst{display:flex;width:fit-content;margin-top:8px}   /* 外送灯跟门店灯同一个样子（2026-10-26 业主） */
.status.delst .rider{width:36px;height:24px;flex:none;background:#fff;border-radius:var(--rs);padding:1px}
.dot{width:10px;height:10px;border-radius:50%;background:#bbb}
.dot.on{background:#4ADE80}.dot.off{background:#F87171}
.dot.go{background:#4ADE80}.dot.warn{background:#FACC15}.dot.stop{background:#F87171}
.hero .acts{display:flex;flex-wrap:wrap;gap:10px}
.hero .btn.alt{background:transparent;color:#fff;border-color:#fff}

/* hero logo */
.hlogo{width:132px;height:132px;border-radius:var(--r);box-shadow:0 6px 18px rgba(0,0,0,.25);margin-bottom:16px}
@media(min-width:760px){.hlogo{width:176px;height:176px}}

/* outlets */
.region{text-align:center;color:var(--p);font-size:22px;margin:30px 0 16px;letter-spacing:2px}
/* 门店地址：区域标题字距由宽收紧淡入；分店卡片像翻起来一样轻轻立起（上浮 + 微微后仰回正），一张接一张 */
.region.rv{opacity:0;letter-spacing:10px;transition:opacity 1s ease,letter-spacing 1.2s cubic-bezier(.2,.7,.3,1)}
.region.rv.seen{opacity:1;letter-spacing:2px}
.olist{perspective:900px}
.outlet.rv{opacity:0;transform:translateY(18px) rotateX(10deg);transform-origin:50% 100%;transition:opacity .9s ease,transform 1s cubic-bezier(.2,.75,.25,1);transition-delay:var(--d,0s)}
.outlet.rv.seen{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.region.rv,.outlet.rv{opacity:1;transform:none;letter-spacing:2px;transition:none}}
.ogrp:first-child .region{margin-top:6px}
.region small{display:block;font-size:13px;color:var(--mut);letter-spacing:0;font-weight:600}
.olist{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.olist{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.olist{grid-template-columns:1fr}}
.olist.one{grid-template-columns:minmax(0,340px);justify-content:center}
.outlet{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:6px}
.outlet h3{margin:0;font-size:17px;color:var(--p)}
/* 手机：只显示前 3 间，其余按箭头展开 */
.omore{display:none}
@media(max-width:560px){
  .ogrp:not(.open) .more{display:none}
  .omore{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:16px 0 0;padding:11px 14px;background:#fff;color:var(--p);border:1px solid var(--p);border-radius:var(--r);font:inherit;font-weight:700;font-size:15px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.08)}
  .omore .arr{display:inline-block;transition:transform .2s}
  .ogrp.open .omore .arr{transform:rotate(180deg)}
}
.outlet .ln{font-size:14px;color:var(--tx)}
.outlet .ad{font-size:13.5px;color:var(--mut)}
.outlet .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.outlet .acts a{font-size:13px;padding:7px 14px;min-height:36px}

/* order type */
.otype{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.otype button{border:2px solid var(--line);background:#fff;border-radius:var(--r);padding:10px;font-weight:800;font-size:15px;min-height:46px}
.otype button.on{border-color:var(--p);background:var(--p);color:#fff}

/* payment */
.paybox{padding:12px;background:#F4FBF6;border:1px solid #CDEBD6;border-radius:var(--r)}
.paymodes{display:flex;flex-wrap:wrap;gap:8px}
.paymodes label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:var(--rs);padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;margin:0}
.paymodes label.on{border-color:var(--ok);background:#E6F6EC;color:var(--ok)}
.paymodes input[type=radio]{width:auto;margin:0;padding:0}
.paydetail{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.payamt{font-size:16px}.payamt b{font-size:20px;color:var(--p)}
.payqr{display:block;margin:0 auto;max-width:240px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#fff}
.payqr img{width:100%}
.bank{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.bank div{display:flex;align-items:center;gap:8px;padding:5px 0;flex-wrap:wrap}
.bank span{color:var(--mut);font-size:13px;min-width:70px}
.bank .accno{font-size:17px;letter-spacing:1px}
.bank .copy{padding:4px 12px;min-height:32px;font-size:13px;margin-left:auto}

/* 付款步骤 */
.paystep{position:fixed;inset:0;z-index:150;background:rgba(20,11,8,.72);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.paystep.show{display:flex;animation:psFade .35s ease both}
.psbox{background:#fff;width:100%;max-width:440px;border-top:4px solid var(--a);box-shadow:6px 6px 0 rgba(0,0,0,.3);padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;border-radius:var(--r);margin:auto 0}
/* 视窗进场（2026-10-30 业主：手机版下单/截单也要美）：背景淡入、卡片往上浮出；放得下就置中，太长照样从上往下卷 */
.paystep.show>.psbox{animation:psUp .5s cubic-bezier(.2,.8,.25,1) both}
@keyframes psFade{from{background:rgba(20,11,8,0)}to{background:rgba(20,11,8,.72)}}
@keyframes psUp{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.paystep.show,.paystep.show>.psbox{animation:none}}
@media(max-width:560px){.paystep{padding:16px 12px calc(16px + env(safe-area-inset-bottom))}.psbox{padding:14px 14px 16px}}
.pshead{display:flex;align-items:center;justify-content:space-between;font-size:18px}
.lbx.dark{color:var(--tx);border-color:var(--line)}
.lbx.dark:hover{color:#fff}
.pssteps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pssteps li{font-size:12px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.pssteps li span{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:var(--rs);font-weight:800}
.pssteps li.on{color:var(--p)}.pssteps li.on span{border-color:var(--p);background:var(--p);color:#fff}
.pssteps li.done{color:var(--ok)}.pssteps li.done span{border-color:var(--ok);background:var(--ok);color:#fff}
.psamt{display:flex;justify-content:space-between;align-items:baseline;background:#FFF6DA;border:1px solid var(--a);padding:10px 12px;font-weight:700}
.psamt b{font-size:24px;color:var(--p)}
.psref{font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.psref b{font-size:16px;letter-spacing:1px}
.psref .copy{padding:3px 10px;min-height:30px;font-size:12px}
.psref .note{width:100%}
.psqr{display:flex;flex-direction:column;align-items:center;gap:8px}
.psqr img{width:min(260px,100%);border:1px solid var(--line)}
.psqr .btn{padding:6px 14px;min-height:36px;font-size:14px}
.pscheck{display:flex;gap:10px;align-items:center;font-weight:800;padding:10px 12px;border:2px dashed var(--ok);background:#F4FBF6;cursor:pointer}
.pscheck input{width:22px;height:22px;accent-color:var(--ok)}
.psgo{width:100%}
.psdone{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.psdone .big{font-size:44px}
.psdone h3{margin:0;color:var(--ok)}
.psdone p{margin:0;color:var(--mut)}

.pswait{display:flex;gap:12px;align-items:center;padding:12px;border:2px dashed var(--line);background:#FFFBF0;font-weight:700}
.pswait.on{border-color:var(--a)}
.pswait.bad{border-color:var(--p);background:#FDF1F1}
.pswait.good{border-color:var(--ok);background:#F4FBF6}
.tksteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tksteps li{display:flex;gap:10px;align-items:center;color:var(--mut);font-weight:700}
.tksteps li span{width:24px;height:24px;flex:0 0 24px;display:grid;place-items:center;border:2px solid var(--line);border-radius:var(--rs);font-size:13px}
.tksteps li.done{color:var(--ok)}.tksteps li.done span{background:var(--ok);border-color:var(--ok);color:#fff}
.tksteps li.on{color:var(--ink,#222)}.tksteps li.on span{border-color:var(--a);background:#FFF6DB}
.pmh{font-weight:800;margin:2px 0 -2px}
.pmlist{display:flex;flex-direction:column;gap:8px}
.pm{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;color:var(--tx);box-shadow:2px 2px 0 rgba(180,35,42,.08);position:relative}
.pm:hover{border-color:var(--p)}
.pm .pmi{font-size:24px;line-height:1;flex:none}
.pm .pmt{flex:1;min-width:0}.pm .pmt b{display:block;font-size:15.5px}.pm .pmt small{display:block;color:var(--mut);font-size:13px;line-height:1.35}
.pm.best{border:2px solid var(--p);background:#FFF6F3;padding:14px 14px;box-shadow:3px 3px 0 rgba(180,35,42,.2)}
.pm.best .pmi{font-size:30px}.pm.best .pmt b{font-size:18px;color:var(--p)}
.pm.best em{font-style:normal;background:var(--p);color:#fff;font-size:12px;font-weight:800;padding:3px 8px;flex:none}
.pm.small{border:0;box-shadow:none;background:none;padding:4px 2px;justify-content:center;color:var(--mut)}
.pm.small .pmi{font-size:16px}.pm.small .pmt{flex:none}.pm.small .pmt b{font-size:13.5px;font-weight:600;text-decoration:underline}
.trkchip.fade,#trkbox.fade{opacity:0;transition:opacity 3s ease}
.cempty{padding:2px 0 8px}.cempty p{font-size:15px;color:var(--mut);margin:0 0 12px}.cempty .btn{width:100%}
.tketa{display:flex;align-items:center;gap:10px;background:#EEF8F1;border:1px solid #BFE3CB;border-left:4px solid var(--ok);padding:10px 12px;margin:0 0 12px}
.tketa span{font-size:24px}
.tketa b{display:block;font-size:17px;color:#14532D}
.tketa small{display:block;color:var(--mut);font-size:12.5px}
.tkrider{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);flex-wrap:wrap}
.tkrider .btn{padding:6px 14px;min-height:36px;font-size:14px}
.dhbtns{display:flex;gap:8px;align-items:center}
.myob{padding:4px 10px;min-height:34px;font-size:14px}
.morow{display:flex;gap:8px}.morow input{flex:1;min-width:0;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:var(--rs)}
.molist{display:flex;flex-direction:column;gap:8px}
.moitem{border:1px solid var(--line);border-left:4px solid var(--a);padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:#fff}
.moitem.ok{border-left-color:var(--ok)}.moitem.bad{border-left-color:var(--p)}
.moitem .mot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.moitem .mot span{color:var(--mut);font-size:13px}
.modet{border-top:1px dashed var(--line);padding-top:4px}.modet summary{cursor:pointer;font-weight:700;color:var(--p);font-size:14px;padding:4px 0}
.mol{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0}.mol b{white-space:nowrap}.mol.big{font-size:16px;font-weight:800}
.motot{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.mobtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.moitem .mos{font-weight:700}.moitem .btn{padding:6px 14px;min-height:36px;font-size:14px}
.trkchip{position:fixed;left:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:59;display:none;max-width:min(360px,calc(100% - 32px));box-shadow:3px 3px 0 rgba(0,0,0,.25)}
.trkchip.show{display:flex}
.trkchip button{border:0;cursor:pointer;font:inherit;touch-action:manipulation}
.trkchip .tkopen{display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:#fff;color:#222;padding:8px 12px;border-left:4px solid var(--a);border-radius:var(--r) 0 0 var(--r);text-align:left;min-width:0;font-size:13px}
.trkchip .tkopen.ok{border-left-color:var(--ok)}.trkchip .tkopen.bad{border-left-color:var(--p)}
.trkchip .tkopen span{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.trkchip .tkx{background:#fff;color:var(--mut);padding:0 10px;border-left:1px solid var(--line);border-radius:0 var(--r) var(--r) 0;min-width:36px}
.pswait .note{font-weight:500;margin-top:4px}
.spin{flex:0 0 auto;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* vouchers */
.vbox{margin-bottom:18px;border-left:6px solid var(--a)}
.vbox h3{margin:0 0 4px;font-size:18px}
.vrow{display:flex;gap:8px}

/* ===== 有棱有角的整体风格 ===== */
h1,h2,.region,.mname,.fhead h3{font-family:var(--serif);letter-spacing:1px}
h2{position:relative;padding-bottom:12px;margin-bottom:12px}
h2::after{content:"";position:absolute;left:0;bottom:0;width:56px;height:3px;background:var(--a)}
#outlets h2::after{left:50%;transform:translateX(-50%)}
.btn{letter-spacing:.5px}
.item,.outlet,.promo,.mcat,.card{box-shadow:3px 3px 0 rgba(180,35,42,.10)}
.item:hover,.outlet:hover,.promo:hover{box-shadow:4px 4px 0 rgba(180,35,42,.22)}
.hero{border-bottom:5px solid var(--a)}
.hero::after{content:"";position:absolute;inset:14px;border:1px solid rgba(242,180,23,.35);pointer-events:none}
/* ===== 本店故事（2026-10-30 业主：从首页红框搬出来，放在优惠活动上面）：左文字 + 右边招牌菜照片拼图 ===== */
.storysec{background:#FBF1E4;position:relative;overflow:hidden;overflow:clip}
.storysec::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 18%,rgba(242,180,23,.16),transparent 42%),radial-gradient(circle at 92% 88%,rgba(180,35,42,.08),transparent 40%);pointer-events:none}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;position:relative}
.eyebrow{display:inline-block;font-size:12px;font-weight:800;letter-spacing:3px;color:var(--p);background:#fff;border:1px solid var(--line);padding:4px 10px;margin-bottom:12px}
.eyebrow[hidden]{display:none}
.stext h2{font-size:30px}
.stext p{font-size:16px;line-height:1.85;margin:0 0 12px}
.spoints{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.spoints:empty{display:none}
.spoints li{background:#fff;border:1px solid var(--line);border-top:3px solid var(--a);padding:12px 10px;text-align:center;box-shadow:3px 3px 0 rgba(180,35,42,.08)}
.spoints li{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:20px 6px 18px}
.spoints .spi,.promo .pi{flex:none;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:rgba(180,35,42,.09);color:var(--p);border-radius:var(--rs)}
.spoints .spi svg,.promo .pi svg{width:30px;height:30px}
.spoints b{margin-top:0}
.spoints b{display:block;font-size:16.5px;margin-top:2px;letter-spacing:.5px}
.spoints small{display:block;color:var(--mut);font-size:13px;line-height:1.4;margin-top:2px}
.spics{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.1fr 1fr;gap:10px;aspect-ratio:1/1;max-height:470px}
.spics[hidden]{display:none}
.spics figure{margin:0;overflow:hidden;border:4px solid #fff;box-shadow:4px 4px 0 rgba(180,35,42,.14);background:#eee}
.spics img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.spics .sp0{grid-column:1/3}
.spics .sp0 img{object-position:50% 78%}   /* 菜图上方印着菜名：横幅只露出下半部的菜 */
.spics figure:nth-child(4){display:none}
.storysec.rv .stext{opacity:0;transform:translateX(-40px);transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.75,.25,1)}
/* 照片：鱼头从上面、啦啦从左边、猪脚从右边进来；进来后照片慢慢放大缩小（像在动） */
.storysec.rv .spics figure{opacity:0;transition:opacity 1s ease,transform 1.2s cubic-bezier(.2,.75,.25,1)}
.storysec.rv .spics .sp0{transform:translateY(-60px);transition-delay:.15s}
.storysec.rv .spics .sp1{transform:translateX(-70px);transition-delay:.6s}
.storysec.rv .spics .sp2{transform:translateX(70px);transition-delay:.95s}
.storysec.rv .stext.seen,.storysec.rv .spics.seen figure{opacity:1;transform:none}
.storysec .spics.seen img{animation:kenB 9s ease-in-out 2.2s infinite alternate}
.storysec .spics.seen .sp1 img{animation-delay:3s}.storysec .spics.seen .sp2 img{animation-delay:3.7s}
@keyframes kenB{from{transform:scale(1)}to{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.storysec.rv .stext,.storysec.rv .spics figure{opacity:1;transform:none;transition:none}.storysec .spics.seen img{animation:none}}
@media(max-width:860px){
  .sgrid{grid-template-columns:1fr;gap:22px}
  .stext h2{font-size:26px}
  .stext p{font-size:15.5px;line-height:1.75}
  /* 手机：三张照片放在故事文字上面（2026-10-30 业主），跟电脑一样：上面横幅鱼头、下面啦啦+猪脚，照样从上/左/右滑进来 */
  .spics{order:-1;aspect-ratio:auto;height:auto;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;max-height:none;gap:8px}
  .spics .sp0{grid-column:1/3;aspect-ratio:16/9}
  .spics .sp1,.spics .sp2{aspect-ratio:1/1}
  .spics figure{border-width:3px}
}
@media(max-width:480px){.spoints{gap:6px}.spoints li{padding:14px 6px 12px;gap:8px}.spoints .spi{width:42px;height:42px}.spoints .spi svg{width:24px;height:24px}.spoints b{font-size:13.5px}.spoints small{display:none}}

}

/* ---------- 时间工具 ---------- */
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const toMin = s => {const [h,m]=s.split(":").map(Number);return h*60+m;};
const fromMin = m => pad(Math.floor(m/60))+":"+pad(m%60);
const parseYmd = s => {const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const hoursOf = day => (S.hours&&S.hours[day]) || null;
/* 某天可选的时间点；leadMin = 距离现在至少多少分钟；lastGap = 打烊前多少分钟停止接单 */
function slotsFor(dateStr, step, leadMin, lastGap){
  const d = parseYmd(dateStr), segs = hoursOf(d.getDay()); if(!segs) return [];
  /* 按真实时间比：可跨日（例如订位要提前 12 小时，今晚的时段明早才开放不了） */
  const earliest = Date.now() + leadMin*60000;
  const out = [];
  segs.forEach(([a,b])=>{
    const s=toMin(a), e=toMin(b)-lastGap;
    for(let m=Math.ceil(s/step)*step; m<=e; m+=step){ const at=new Date(d); at.setHours(0,m,0,0); if(at.getTime()>=earliest) out.push(fromMin(m)); }
  });
  return out;
}
function openState(){
  const now=new Date(), m=now.getHours()*60+now.getMinutes(), segs=hoursOf(now.getDay());
  if(segs){ for(const [a,b] of segs){ if(m>=toMin(a)&&m<toMin(b)) return {open:true,until:b}; } }
  for(let i=0;i<8;i++){
    const d=new Date(now); d.setDate(now.getDate()+i); const sg=hoursOf(d.getDay()); if(!sg) continue;
    for(const [a] of sg){ if(i>0 || toMin(a)>m) return {open:false,next:(i===0?"":t("days")[d.getDay()]+" ")+a}; }
  }
  return {open:false};
}

/* ---------- 购物车 ---------- */
/* 每道菜可有多个份量(prices)和做法(options)；购物车每一行的 key = 菜id|份量序号|做法序号 */
const allItems = Object.create(null);   /* 无原型：localStorage 里的 "__proto__"/"constructor" 之类 id 查不到东西 */
(S.menu||[]).forEach(c=>(c.items||[]).forEach(it=>{allItems[it.id]=it;}));
const canOrder = it => !it.soldOut && !it.seasonal;
const sizeNames = (it,lg) => { const n=(it.prices||[]).length; const zh=it.sizes||(n===2?["小","大"]:n===3?["小","中","大"]:n===4?["小","中","大","特大"]:[]); const en=it.sizesEn||(n===2?["S","L"]:n===3?["S","M","L"]:n===4?["S","M","L","XL"]:[]); return (lg||lang)==="en"?en:zh; };
const unitPrice = (it,si) => it.prices ? it.prices[si] : it.price;
/* 购物车每一行 key = 菜id|份量|做法，有客制化时再加 |选项序号(用.连接)|备注代号；例：A001|1|0|0.2|n1a2b3c */
const parseKey = k => { const [id,si,oi,m,n]=k.split("|"); return {it:allItems[id], si:+si||0, oi:+oi||0, mods:m?m.split(".").map(Number):[], nh:n||""}; };
const keyOf = (id,si,oi,mods,nh) => { const m=(mods||[]).slice().sort((a,b)=>a-b).join("."); return id+"|"+(si||0)+"|"+(oi||0)+(m||nh?"|"+m+"|"+(nh||""):""); };
const baseKey = k => k.split("|").slice(0,3).join("|");
const noteHash = s => { let h=5381; for(const c of s) h=((h*33)^c.codePointAt(0))>>>0; return "n"+h.toString(36); };
/* 外卖价：priceAdd 有填 = 每份菜单价 + 固定金额；否则菜单价 × (1+priceMarkup) 往上凑整到 markupStep；自取照原价 */
const catOf = Object.create(null); (S.menu||[]).forEach(c=>(c.items||[]).forEach(it=>{catOf[it.id]=c;}));
const delPrice = p => { const d=(S.ordering&&S.ordering.delivery)||{}, a=+d.priceAdd||0, m=+d.priceMarkup||0, st=+d.markupStep||0.5; if(a>0) return Math.round((p+a)*100)/100; return m>0 ? Math.round(Math.ceil(p*(1+m)/st-1e-9)*st*100)/100 : p; };
const hasDelMarkup = () => { const d=(S.ordering&&S.ordering.delivery)||{}; return +d.priceAdd>0||+d.priceMarkup>0; };
const priceFor = (it,si) => { const p=unitPrice(it,si); return isDel()?delPrice(p):p; };
/* 打包盒：每份都加；item.box > 分类 box > packaging.fee */
const PK = () => (S.ordering&&S.ordering.packaging)||null;
const boxOf = it => { if(!PK()) return 0; const c=catOf[it.id]; return +(it.box!=null?it.box:(c&&c.box!=null?c.box:PK().fee))||0; };
const CUST = () => (S.ordering&&S.ordering.customize)||{};
const custOpts = it => { const c=catOf[it.id]; return c&&c.customize===false ? [] : (CUST().options||[]); };
let cart = store.get("site_cart",{});
/* localStorage 可被改：只留「格式完全标准」的 key（菜id|整数|整数，跟 keyOf 产生的一模一样）和 1–99 的整数数量，其余一律丢掉。
   这样 key 里不可能夹带引号/HTML，后面拼进 onclick 也安全。 */
if(!cart||typeof cart!=="object"||Array.isArray(cart)) cart={};
let cartNotes = store.get("site_cart_notes",{}); if(!cartNotes||typeof cartNotes!=="object"||Array.isArray(cartNotes)) cartNotes={};
cart=Object.keys(cart).reduce((c,k)=>{ const {it,si,oi,mods,nh}=parseKey(k), q=cart[k], nt=cartNotes[k];
  const modsOk = it && mods.every(x=>Number.isInteger(x)&&x>=0&&x<custOpts(it).length) && new Set(mods).size===mods.length;
  const noteOk = !nh || (typeof nt==="string" && nt.length>0 && nt.length<=60 && noteHash(nt)===nh);
  if(it&&canOrder(it)&&modsOk&&noteOk&&k===keyOf(it.id,si,oi,mods,nh)&&/^[\w-]+$/.test(it.id)&&Number.isInteger(q)&&q>=1&&q<=99&&(it.prices?si<it.prices.length:si===0)&&(it.options?oi<it.options.length:oi===0)) c[k]=q;
  return c; },{});
cartNotes = Object.keys(cart).reduce((o,k)=>{ if(parseKey(k).nh) o[k]=cartNotes[k]; return o; },{});
const pick = {};   /* 卡片上目前选的份量/做法 */
const curPick = it => pick[it.id] || (pick[it.id]={si:0,oi:0});
const saveCart = () => { Object.keys(cartNotes).forEach(k=>{ if(!cart[k]) delete cartNotes[k]; }); store.set("site_cart",cart); store.set("site_cart_notes",cartNotes); };
const cartCount = () => Object.values(cart).reduce((a,b)=>a+b,0);
const cartTotal = () => Math.round(Object.entries(cart).reduce((s,[k,q])=>{const {it,si}=parseKey(k);return s+(it?priceFor(it,si)*q:0);},0)*100)/100;
const boxTotal = () => Math.round(Object.entries(cart).reduce((s,[k,q])=>{const {it}=parseKey(k);return s+(it?boxOf(it)*q:0);},0)*100)/100;
function lineLabel(k, forWa){
  const {it,si,oi}=parseKey(k), parts=[];
  if(it.prices) parts.push(sizeNames(it, forWa?"zh":lang)[si]);
  if(it.options) parts.push(it.options[oi]);
  return parts.length?" ("+parts.join(", ")+")":"";
}
/* 客制化文字：[不要葱, 不要蒜米; 其他: …]（讯息一律用中文，店员看得懂；check.html 会略过方括号里的内容） */
function custLabel(k, forWa){
  const {it,mods,nh}=parseKey(k), os=custOpts(it), zh=forWa||lang!=="en";
  const parts=mods.map(i=>os[i]?(zh?os[i].zh:(os[i].en||os[i].zh)):"").filter(Boolean);
  const nt=nh?cartNotes[k]:"";
  if(!parts.length&&!nt) return "";
  return " ["+parts.join(", ")+(nt?(parts.length?"; ":"")+t("custOther")+": "+nt:"")+"]";
}
const cleanNote = s => String(s||"").replace(/[\[\]=|<>•·\r\n\t]/g," ").replace(/\s+/g," ").trim().slice(0,+CUST().noteMax||30);
/* 加进购物车（客制化视窗的「加入」按钮用）：同菜同份量同做法同客制化 → 合并数量 */
function addLine(it,si,oi,mods,note,q){
  const nt=cleanNote(note), nh=nt?noteHash(nt):"", k=keyOf(it.id,si,oi,mods,nh);
  if(nh) cartNotes[k]=nt;
  cart[k]=Math.min((cart[k]||0)+q,99); saveCart(); refreshCart(); toast(t("added")+" ✓");
}
const itemQty = (id,si,oi) => Object.entries(cart).reduce((n,[k,q])=>n+(baseKey(k)===keyOf(id,si,oi)?q:0),0);
/* 客人选的分店：第一次加菜时一定要先选（跳出「选择分店」），之后购物车/外卖距离都用它 */

const delOK = i => { const o=outlets()[+i]; return !!o && (!delOutletsOn() || o.delivery===true); };
const delOutletNames = () => outlets().filter(o=>o.delivery===true).map(outletLabel).join("、");

        rider:c.rider&&typeof c.rider==="object"?{name:String(c.rider.name||""),phone:String(c.rider.phone||"").replace(/[^\d+]/g,""),plate:String(c.rider.plate||"")}:null} : null;
    }
  }catch(e){}
  if(!trk) return;
  if(trk.st==="notfound"){ trkClear(); return; }
  if(trk.st==="paid"&&!trk.paidAt) trk.paidAt=Date.now();
  { const c=cCode(); if((c===500||c===600)&&!trk.pickAt) trk.pickAt=Date.now(); }
  trkSave();
  const after=trkSig();
  if(after!==before) trkNotify();
  trkRender();
  if(wasPend!==!!pendOrder()) refreshCart();   /* 付款成功/被取消：购物车里的「待付款」卡片跟着消失 */
  if(!trkFinal()&&Date.now()-trk.t0<TRK_MAX) trkT=setTimeout(trkPoll, trk.st==="pending"?(trk.hp?5000:3000):trk.type==="delivery"?8000:20000);
}
function trkNotify(){
  const msg=t("tkUpd").replace("{s}",trkStatusText());
  if(!trkShow&&document.visibilityState==="visible") toast(msg);
  try{ if(document.visibilityState!=="visible"&&"Notification" in window&&Notification.permission==="granted") new Notification(S.name||"Meng Kee",{body:msg+" · "+trk.ref,icon:"images/logo.png",tag:"mk-"+trk.ref}); }catch(e){}
  try{ navigator.vibrate&&navigator.vibrate(120); }catch(e){}
}
function trkClear(){ trkStop(); trk=null; trkSave(); trkClose(); trkRender(); try{ refreshCart(); }catch(e){} }
function trkOpen(){ if(!trk) return; trkShow=true; $("trkbox").classList.add("show"); trkRender(); if(!trkFinal()) trkPoll(); }
function trkClose(){ trkShow=false; $("trkbox").classList.remove("show"); $("trkbox").innerHTML=""; trkRender(); }
function trkNotifyAsk(){ try{ Notification.requestPermission().then(()=>trkRender()); }catch(e){} }
function trkRender(){
  const chip=$("trkchip");
  if(!trk){ chip.classList.remove("show"); chip.innerHTML=""; return; }
  const c=cCode(), bad=!trk.done&&(trk.st==="rejected"||c===475||c===650||c===900||(trk.st==="pending"&&Date.now()-trk.t0>30*60*1000));
  const done=trkFinal()&&trk.st!=="rejected";
  chip.classList.toggle("show",!trkShow);
  /* 订单完成后（2026-10-31 业主）：30 秒后自己用 3 秒慢慢淡出、然后不再追踪；进度视窗开着也一起淡出关掉 */
  if(done&&!bad){ if(!trkFadeT) trkFadeT=setTimeout(()=>{ trkFadeT=null; if(!trk) return;
      const c=$("trkchip"), bx=$("trkbox"); c.classList.add("fade"); bx.classList.add("fade");
      trkFadeT=setTimeout(()=>{ trkFadeT=null; c.classList.remove("fade"); bx.classList.remove("fade"); if(trk) trkClear(); },3000); },30000); }
  else if(trkFadeT){ clearTimeout(trkFadeT); trkFadeT=null; chip.classList.remove("fade"); $("trkbox").classList.remove("fade"); }
  chip.innerHTML=`<button type="button" class="tkopen ${bad?"bad":done?"ok":""}" onclick="__site.trkOpen()"><b>${done?"✅":bad?"⚠️":"📦"} ${esc(trk.ref)}</b><span>${esc(trkStatusText())}</span></button><button type="button" class="tkx" aria-label="close" onclick="${pendOrder()?`__site.pdCancel()`:`__site.trkClear()`}">✕</button>`;
  if(!trkShow) return;
  const del=trk.type==="delivery"&&!trk.fb;
  const pk3 = !del && !trk.fb && trk.hasDone!==false;   /* 自取：已下单 → 店家确认收款 → 已完成 */
  /* 外送 6 步：已下单 → 付款 → 骑手已接单(200) → 已取餐(500) → 配送中(600，跟着 Delyva 实时状态) → 已送达(700) */
  const stage = trk.st!=="paid" ? 2 : !del ? (pk3?3:2) : trk.done||c===700||c===1000 ? 6 : c===600||c===650 ? 6 : c===500 ? 5 : c===200||c===400||c===475 ? 4 : 3;
  const s2=t(trk.hp?"hpS2":"tkS2");
  const steps=del?[t("tkS1"),s2,t("tkS3"),t("tkS4"),t("tkS7"),t("tkS5")]:pk3?[t("tkS1"),s2,t("tkS6")]:[t("tkS1"),s2];
  const r=trk.courier&&trk.courier.rider, help=waLink(t("psHelpMsg").replace("{r}",trk.ref).replace("{x}",money(trk.amount)),trk.oi);
  const canNotify=!trkFinal()&&"Notification" in window&&Notification.permission!=="denied";
  $("trkbox").innerHTML=`<div class="psbox" role="dialog" aria-modal="true">
    <div class="pshead"><b>📦 ${esc(t("tkTitle"))}</b><button type="button" class="lbx dark" onclick="__site.trkClose()" aria-label="close">✕</button></div>
    <div class="psamt">${esc(t("psRef"))}<b>${esc(trk.ref)}</b></div>
    ${trk.st==="rejected"?"":`<ol class="tksteps">${steps.map((x,i)=>`<li class="${i+1<stage||stage===steps.length&&done?"done":i+1===stage?"on":""}"><span>${i+1<stage||stage===steps.length&&done?"✓":i+1}</span>${esc(x)}</li>`).join("")}</ol>`}
    <div class="pswait ${bad?"bad":done?"good":"on"}">${!bad&&!done?`<span class="spin"></span>`:""}<div><b>${esc(trkStatusText())}</b><div class="note">${esc(
      trk.st==="pending"?t(trk.hp?(Date.now()-trk.t0>30*60*1000?"hpUnpaidB":"hpWaitB"):Date.now()-trk.t0>30*60*1000?"psTimeoutB2":"psWaitB2"):trk.st==="rejected"?t("psContact"):trk.done?"":!del?t(trk.type==="delivery"?"psPaidB2":"tkPickupB").replace("{r}",trk.ref):"")}</div></div></div>
    ${del&&trk.st==="paid"?trkEtaHTML():""}
    ${del&&!trk.done&&c!==900&&r&&r.name?`<div class="tkrider"><div>🛵 ${esc(t("tkRider"))}: <b>${esc(r.name)}</b>${r.plate?` · ${esc(r.plate)}`:""}</div>${r.phone?`<a class="btn alt" href="tel:${esc(r.phone)}">📞 ${esc(t("tkCall"))}</a>`:""}</div>`:""}
    ${del&&!trk.done&&trk.courier&&trk.courier.track&&![700,1000,900].includes(c)?`<a class="btn psgo" href="${esc(trk.courier.track)}" target="_blank" rel="noopener">📍 ${esc(t("tkTrack"))}</a>`:""}
    ${canNotify?(Notification.permission==="granted"?`<div class="note">🔔 ${esc(t("tkNotifyOn"))}</div>`:`<button type="button" class="btn alt psgo" onclick="__site.trkNotifyAsk()">🔔 ${esc(t("tkNotify"))}</button>`):""}
    ${trk.hp&&trk.st==="pending"?(pendAlive()?`<button type="button" class="btn psgo" onclick="__site.pdPay()">💳 ${esc(t("pdPay"))}</button><button type="button" class="btn alt psgo" onclick="__site.pdCancel()">${esc(t("pdCancel"))}</button>`:`<button type="button" class="btn alt psgo" onclick="__site.pdCancel()">${esc(t("pdClear"))}</button>`):""}
    ${bad?`<a class="btn wa psgo" href="${esc(help)}" target="_blank" rel="noopener">💬 ${esc(t("psContactBtn"))}</a>`:""}
    <button type="button" class="btn ${done?"":"alt "}psgo" onclick="__site.trkClose()">${esc(t(done?"psFinish":"tkClose"))}</button>
  </div>`;
}
function stopAutoPay(P){ if(P&&P.timer){ clearInterval(P.timer); P.timer=null; } if(P&&P.onVis){ document.removeEventListener("visibilitychange",P.onVis); P.onVis=null; } }
function closePayStep(force){
  const P=payPending;
  if(!force&&P&&P.st==="creating") return;
  stopAutoPay(P); $("paystep").classList.remove("show"); $("paystep").innerHTML=""; payPending=null;
}
function renderPayStep(){
  const P=payPending; if(!P) return; const p=payInfo(P.oi)||{};
  if(P.hp){   /* HitPay：确认金额 → 前往 HitPay 付款页 → 付款后自动确认（不用勾选、不用截图） */
    $("paystep").innerHTML=`<div class="psbox" role="dialog" aria-modal="true">
      <div class="pshead"><b>💳 ${esc(t("psTitle"))}</b><button type="button" class="lbx dark" onclick="__site.psClose()" aria-label="close">✕</button></div>
      <ol class="pssteps">${[t("psStep1"),t("hpStep2"),t("hpStep3")].map((x,i)=>`<li class="${i===0?"done":i===1?"on":""}"><span>${i===0?"✓":i+1}</span>${esc(x)}</li>`).join("")}</ol>
      <div class="psamt">${esc(t("payAmount"))}<b>${money(P.amount)}</b></div>
      ${P.repay?`<div class="note" style="margin:0">${esc(t("pdRef"))}: <b>${esc(P.ref)}</b></div>`:""}
      ${hpMethodsList().length?"":`<div class="note" style="margin:0 0 10px">${esc(t("hpMethods"))}</div>`}
      ${P.st==="creating"?`<div class="pswait on"><span class="spin"></span>${esc(t("hpCreating"))}</div>`
        :P.st==="err"?`<div class="pswait bad"><div><b>${esc(t("hpErrT"))}</b><div class="note">${esc(P.err||t("hpNoNet"))}</div></div></div>
          ${P.retry!==false?`<button type="button" class="btn psgo" onclick="__site.psHp()">🔄 ${esc(t("hpRetry"))}</button>`:""}
          <button type="button" class="btn alt psgo" onclick="__site.psClose()">${esc(t("tkClose"))}</button>`
        :hpMethodsList().length?`<div class="pmh">${esc(t("pmPick"))}</div><div class="pmlist">${hpMethodsList().map(m=>`<button type="button" class="pm${m.best?" best":""}${m.small?" small":""}" onclick="__site.psHp('${esc(m.key)}')">${pmIcon(m)}<span class="pmt"><b>${esc(L(m,"t"))}</b>${L(m,"d")?`<small>${esc(L(m,"d"))}</small>`:""}</span>${m.best?`<em>${esc(t("pmBest"))}</em>`:""}</button>`).join("")}</div><div class="note">${esc(t("hpAfter"))}</div>`
        :`<button type="button" class="btn psgo" onclick="__site.psHp()">💳 ${esc(t("hpGo"))}</button><div class="note">${esc(t("hpAfter"))}</div>`}
    </div>`;
    return;
  }
  const steps=[t("psStep1"),t("psStep2"),t(P.auto?"psStep3b":"psStep3")], cur=P.auto?(P.st==="paid"?4:P.sent?3:2):(P.sent?4:2);
  $("paystep").innerHTML=`<div class="psbox" role="dialog" aria-modal="true">
    <div class="pshead"><b>💳 ${esc(t("psTitle"))}</b><button type="button" class="lbx dark" onclick="__site.psClose()" aria-label="close">✕</button></div>
    <ol class="pssteps">${steps.map((x,i)=>`<li class="${i+1<cur?"done":i+1===cur?"on":""}"><span>${i+1<cur?"✓":i+1}</span>${esc(x)}</li>`).join("")}</ol>
    ${!P.sent?`
      <div class="psamt">${esc(t("payAmount"))}<b>${money(P.amount)}</b></div>
      <div class="psref">${esc(t("psRef"))} <b>${esc(P.ref)}</b> <button type="button" class="btn alt copy" onclick="__site.copy('${esc(P.ref)}')">${esc(t("copy"))}</button><div class="note">${esc(t("psRefHint"))}</div></div>
      ${p.qr?`<div class="psqr"><img src="${esc(p.qr)}" alt="DuitNow QR"><a class="btn alt" href="${esc(p.qr)}" download>⬇ ${esc(t("psSaveQr"))}</a><div class="note">${esc(t("payQrHint"))}</div></div>`:""}
      ${bankHTML(p)}
      ${!P.auto||P.st==="pay"?`<label class="pscheck"><input type="checkbox" id="psChk" onchange="__site.psCheck(this.checked)"> ${esc(t("psPaid").replace("{x}",money(P.amount)))}</label>
      <button type="button" class="btn ${P.auto?"":"wa "}psgo" id="psSend" disabled onclick="__site.psSend()">${P.auto?`✅ ${esc(t("psSubmit"))}`:`💬 ${esc(t("psSend"))}`}</button>
      ${P.auto?"":`${P.fb?`<div class="err" style="margin:6px 0 0">⚠️ ${esc(t("psFallback"))}</div>`:""}<div class="note">${esc(L(p,"note")||t("psAfter"))}</div>`}`
      : `<div class="pswait"><span class="spin"></span>${esc(t("psCreating"))}</div>`}`
    : P.auto?(P.st==="waiting"?`<div class="psamt">${esc(t("psRef"))}<b>${esc(P.ref)}</b></div><div class="pswait on"><span class="spin"></span><div><b>${esc(t("psWaitT2"))}</b><div class="note">${esc(t("psWaitB2"))}</div></div></div>
         <button type="button" class="btn alt psgo" onclick="__site.psDone()">${esc(t("psFinish"))}</button>`
      : P.st==="paid"?`<div class="psdone"><div class="big">✅</div><h3>${esc(t("psPaidT2"))}</h3><p>${esc(t("psPaidB2").replace("{r}",P.ref))}</p>
         <button type="button" class="btn" onclick="__site.psDone()">${esc(t("psFinish"))}</button></div>`
      : `<div class="psamt">${esc(t("psRef"))}<b>${esc(P.ref)}</b></div><div class="pswait bad"><div><b>${esc(t(P.st==="rejected"?"psRejT":"psTimeoutT"))}</b><div class="note">${esc(t(P.st==="rejected"?"psContact":"psTimeoutB2"))}</div></div></div>
         <a class="btn wa psgo" href="${esc(waLink(t("psHelpMsg").replace("{r}",P.ref).replace("{x}",money(P.amount)),P.oi))}" target="_blank" rel="noopener">💬 ${esc(t("psContactBtn"))}</a>
         <button type="button" class="btn alt psgo" onclick="__site.psDone()">${esc(t("psFinish"))}</button>`)
    :`<div class="psdone"><div class="big">✅</div><h3>${esc(t(P.auto?"psPaidT":"psSentT"))}</h3><p>${esc(t(P.auto?"psPaidB":"psSentB"))}</p>
      <button type="button" class="btn ${P.auto?"wa":"alt"}" onclick="__site.psResend()">💬 ${esc(t(P.auto?"psOpenWa":"psReopen"))}</button>
      <button type="button" class="btn" onclick="__site.psDone()">${esc(t("psFinish"))}</button></div>`}
  </div>`;
}
function payStepSend(){
  const P=payPending; if(!P||!$("psChk")||!$("psChk").checked) return;
  if(P.auto){ startAutoPay(); return; }   /* 有后台：订单直接送进店员后台，不用客人发 WhatsApp */
  P.msg=P.buildMsg(`${t("payMethod")}: ${t("payNowWa").replace("{x}",money(P.amount))} · ${t("psRef")} ${P.ref}`);
  openWa(P.msg, P.oi); P.sent=true; renderPayStep();
}
function payStepDone(){ cart={}; saveCart(); const dd=odDraft(); dd.note=""; store.set("site_od_draft",dd); closePayStep(true); if(drawerOpen) closeDrawer(); refreshCart(); toast(t("psThanks")); }
const prepayReq = () => !!(S.payment&&S.payment.requirePrepay);
function payBoxHTML(oi){
  const p=payInfo(oi); if(!p) return prepayReq()?`<div class="paybox"><div class="err" style="margin:0">⚠️ ${esc(t("payNotReady"))}</div></div>`:"";
  const counterOK = p.allowPayAtCounter!==false;
  if(payMode===null || (!counterOK && payMode==="counter")) payMode = p.defaultMode==="counter"&&counterOK ? "counter" : "now";
  const amt = money(finalTotal());
  if(!counterOK && p.hitpay){   /* 只有网上付款：不用单选钮，直接列出可用的付款方式 */
    const ms=hpMethodsList();
    return `<div class="paybox one"><div class="osh">💳 ${esc(t("payTitle"))} · ${esc(t("payOnline"))}</div>
      <div class="pmulti"><span>${esc(t("payMulti"))}</span></div>
      <div class="note">${esc(t("prepayRule"))}</div></div>`;
  }
  return `<div class="paybox"><label class="dvl">💳 ${esc(t("payTitle"))}</label>
    <div class="paymodes">
      <label class="${payMode==="now"?"on":""}"><input type="radio" name="paymode" value="now" ${payMode==="now"?"checked":""} onchange="__site.pay('now')"> ${esc(t("payNow"))}</label>
      ${counterOK?`<label class="${payMode==="counter"?"on":""}"><input type="radio" name="paymode" value="counter" ${payMode==="counter"?"checked":""} onchange="__site.pay('counter')"> ${esc(t(isDel()?"payCod":"payCounter"))}</label>`:""}
    </div>
    ${payMode==="now"?`<div class="paydetail">
      <div class="payamt">${esc(t("payAmount"))} <b>${amt}</b></div>
      <div class="note">${esc(t(p.hitpay?"hpNextHint":"payNextHint"))}</div>${!counterOK?`<div class="note" style="margin-top:4px">${esc(t("prepayRule"))}</div>`:""}
    </div>`:`<div class="note" style="margin-top:6px">${esc(t(isDel()?"payCodHint":"payCounterHint"))}</div>`}
  </div>`;
}
function openDrawer(){ hpWarm(); drawerOpen=true; routeErr=false;   /* 上次 Google 路程没算到：重开购物车再试一次 */ renderDrawer(); $("drawer").classList.add("show"); $("ov").classList.add("show"); document.body.style.overflow="hidden"; refreshCartFab(); }
function closeDrawer(){ drawerOpen=false; $("drawer").classList.remove("show"); $("ov").classList.remove("show"); document.body.style.overflow=""; refreshCartFab(); }
function refreshCartFab(){ $("fab").classList.toggle("show", (cartCount()>0||!!pendOrder()) && !drawerOpen && !!(S.ordering&&S.ordering.enabled)); }

(async()=>{ const c=store.get("site_voucher",""); if(c) await applyVoucher(c,true); })();
function renderAll(){ renderHeader(); renderHero(); renderOutlets(); renderMenuPhotos(); renderPromos(); refreshCart(); renderBooking(); renderAbout(); renderContact(); trkRender(); myRender(); }

/* ---------- 事件 ---------- */
if(S.theme){ const r=document.documentElement.style; if(S.theme.primary) r.setProperty("--p",S.theme.primary); if(S.theme.accent) r.setProperty("--a",S.theme.accent); if(S.theme.dark) r.setProperty("--dk",S.theme.dark); }
$("langBtn").onclick=()=>{lang=lang==="en"?"zh":"en";store.set("site_lang",lang);renderAll();};
$("cartBtn").onclick=openDrawer; $("fab").onclick=openDrawer; $("ov").onclick=closeDrawer;
$("menuToggle").onclick=()=>$("nav").classList.toggle("open");
$("nav").addEventListener("click",e=>{ if(e.target.tagName==="A") $("nav").classList.remove("open"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&custSt){ closeCust(); return; } if(e.key==="Escape"&&$("opick").classList.contains("show")){ closeOutletPick(false); return; } if(payPending&&e.key==="Escape"){ closePayStep(); return; } if(myo&&e.key==="Escape"){ myClose(); return; } if(trkShow&&e.key==="Escape"){ trkClose(); return; } if(lbOpen){ if(e.key==="Escape") lbClose(); else if(e.key==="ArrowRight") lbGo(1); else if(e.key==="ArrowLeft") lbGo(-1); return; } if(e.key==="Escape"&&drawerOpen) closeDrawer(); });
setInterval(renderHero,60000);
renderAll();
trk=trkLoad(); if(trk){ refreshCart(); trkRender(); if(!trkFinal()) trkPoll(); }
/* 从 HitPay 付款页回来（?hp=参考号）：去掉网址参数，打开订单进度（网址里的 status 不可信，只看后台确认） */
(()=>{ let q; try{ q=new URLSearchParams(location.search); }catch(e){ return; } const r=q.get("hp"); if(r===null) return;
  ["hp","reference","status"].forEach(x=>q.delete(x)); try{ history.replaceState(null,"",location.pathname+(q.toString()?"?"+q:"")+location.hash); }catch(e){}
  if(trk&&trk.ref===r) trkOpen(); })();
revealStory();
hpPreconnect();
/* 刷新后回到最上面（2026-10-30 业主：手机刷新会跳到下面，看不到进场动画）：关掉浏览器记住位置，去掉网址的 #锚点，开页和载完都拉回顶部 */
(()=>{ try{ if("scrollRestoration" in history) history.scrollRestoration="manual"; }catch(e){}
  try{ if(location.hash) history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  const top=()=>window.scrollTo({top:0,left:0,behavior:"instant"});
  top(); window.addEventListener("load",top,{once:true}); window.addEventListener("pageshow",e=>{ if(e.persisted) top(); }); })();
})();
</script>
