<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restaurant</title>
<meta name="description" content="">
<script src="config.js"></script>
<style>
:root{--p:#B4232A;--a:#F2B417;--dk:#2A1A14;--bg:#FFFBF5;--card:#fff;--tx:#2A1A14;--mut:#7A6A60;--line:#EADFD3;--ok:#1F8A4C;--r:14px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
section{padding:56px 0}
h2{font-size:26px;margin:0 0 6px;color:var(--p)}
.sub{color:var(--mut);margin:0 0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:12px 22px;font-weight:700;background:var(--p);color:#fff;text-decoration:none;min-height:44px}
.btn.alt{background:#fff;color:var(--p);border:2px solid var(--p)}
.btn.wa{background:#25D366;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(255,251,245,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;text-decoration:none;color:var(--p);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand img{height:38px;width:auto}
nav.links{display:flex;gap:4px;margin-left:auto}
nav.links a{text-decoration:none;padding:8px 10px;border-radius:8px;font-weight:600;font-size:15px}
nav.links a:hover{background:#F6EADB}
.hbtn{border:1px solid var(--line);background:#fff;border-radius:999px;height:40px;min-width:40px;padding:0 12px;font-weight:700;position:relative}
.cartbtn{background:var(--p);color:#fff;border:0}
.cnt{position:absolute;top:-6px;right:-6px;background:var(--a);color:var(--dk);border-radius:999px;font-size:12px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 5px}
.menuToggle{display:none}
@media(max-width:820px){
  nav.links{display:none;position:absolute;top:60px;left:0;right:0;background:var(--bg);flex-direction:column;padding:8px 16px 16px;border-bottom:1px solid var(--line)}
  nav.links.open{display:flex}
  .menuToggle{display:inline-block;margin-left:auto}
  .hbtn.lang{margin-left:0}
}

/* hero */
.hero{background:linear-gradient(135deg,var(--p),#7A1218);color:#fff;padding:72px 0 64px;position:relative;overflow:hidden}
.hero.img{background-size:cover;background-position:center}
.hero.img::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45)}
.hero .wrap{position:relative}
.hero h1{font-size:clamp(30px,6vw,52px);margin:0 0 8px;line-height:1.15}
.hero p{font-size:18px;opacity:.92;margin:0 0 22px}
.status{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);border-radius:999px;padding:6px 14px;font-weight:700;margin-bottom:18px}
.dot{width:10px;height:10px;border-radius:50%;background:#bbb}
.dot.on{background:#4ADE80}.dot.off{background:#F87171}
.hero .acts{display:flex;flex-wrap:wrap;gap:10px}
.hero .btn.alt{background:transparent;color:#fff;border-color:#fff}

/* hero logo */
.hlogo{width:96px;height:96px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);margin-bottom:16px}
@media(min-width:760px){.hlogo{width:120px;height:120px}}

/* outlets */
.region{text-align:center;color:var(--p);font-size:22px;margin:30px 0 16px;letter-spacing:2px}
.region:first-of-type{margin-top:6px}
.region small{display:block;font-size:13px;color:var(--mut);letter-spacing:0;font-weight:600}
.olist{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.olist{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.olist{grid-template-columns:1fr}}
.olist.one{grid-template-columns:minmax(0,340px);justify-content:center}
.outlet{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:6px}
.outlet h3{margin:0;font-size:17px;color:var(--p)}
.outlet .ln{font-size:14px;color:var(--tx)}
.outlet .ad{font-size:13.5px;color:var(--mut)}
.outlet .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.outlet .acts a{font-size:13px;padding:7px 14px;min-height:36px}

/* promos */
.promos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.promo{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);border-left:6px solid var(--a)}
.promo img{width:100%;aspect-ratio:16/9;object-fit:cover}
.promo .in{padding:16px}
.promo h3{margin:0 0 6px;font-size:18px}
.promo .dt{color:var(--mut);font-size:13px;margin-top:8px}

/* menu */
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;position:sticky;top:60px;background:var(--bg);z-index:5;padding-top:8px;-ms-overflow-style:none;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;min-height:40px}
.cats button.on{background:var(--p);color:#fff;border-color:var(--p)}
.mcat{margin:8px 0 26px}
.mcat h3{font-size:20px;margin:0 0 12px;border-bottom:2px solid var(--line);padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.item{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;background:#F6EADB;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;left:10px;background:var(--a);color:var(--dk);font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
.so{position:absolute;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--p);font-size:20px}
.item .in{padding:12px 14px 14px;display:flex;flex-direction:column;flex:1}
.item h4{margin:0;font-size:16px}
.item .en{color:var(--mut);font-size:13px}
.item .ds{color:var(--mut);font-size:13px;margin-top:4px}
.item .ft{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px}
.price{font-weight:800;font-size:17px;color:var(--p)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:36px;height:36px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:20px;line-height:1;font-weight:700}
.qty button.minus{background:#F6EADB;color:var(--p)}
.qty b{min-width:18px;text-align:center}

/* forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
.form input,.form select,.form textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--tx);font-family:inherit}
.form textarea{min-height:70px;resize:vertical}
.form .err{color:var(--p);font-size:14px;min-height:20px}
@media(max-width:560px){.form{grid-template-columns:1fr}}
.note{font-size:13px;color:var(--mut)}

/* about / contact */
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:20px}
.gal figure{margin:0;border-radius:var(--r);overflow:hidden;background:#F6EADB}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover}
.gal figcaption{font-size:13px;padding:6px 10px;color:var(--mut)}
table.hrs{width:100%;border-collapse:collapse}
table.hrs td{padding:7px 0;border-bottom:1px dashed var(--line)}
table.hrs td:last-child{text-align:right}
table.hrs tr.today td{font-weight:800;color:var(--p)}
.map{border:0;width:100%;height:280px;border-radius:var(--r);margin-top:14px}
.social{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.social a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;padding:9px 16px;border-radius:999px;color:#fff;min-height:42px}
.s-facebook{background:#1877F2}.s-instagram{background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF)}.s-foodpanda{background:#D70F64}.s-grabfood{background:#00B14F}

footer{background:var(--dk);color:#E9DCCF;padding:28px 0 calc(28px + env(safe-area-inset-bottom));font-size:14px}
footer a{color:#fff}

/* cart drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:none}
.ov.show{display:block}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#fff;border-radius:18px 18px 0 0;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;transform:translateY(105%);transition:transform .25s;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.drawer:not(.show){visibility:hidden;transition:transform .25s,visibility 0s .25s}
.drawer.show{transform:none}
@media(min-width:760px){.drawer{left:auto;right:16px;bottom:16px;width:440px;border-radius:18px}}
.drawer h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:#F6EADB;border-radius:50%;width:36px;height:36px;font-size:18px}
.cl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cl .nm{flex:1}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:14px 0}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;display:none;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.fab.show{display:inline-flex}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--dk);color:#fff;padding:10px 18px;border-radius:999px;z-index:120;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <a class="brand" href="#top" id="brand"></a>
    <nav class="links" id="nav"></nav>
    <button class="hbtn menuToggle" id="menuToggle" aria-label="Menu">☰</button>
    <button class="hbtn lang" id="langBtn">EN</button>
    <button class="hbtn cartbtn" id="cartBtn" aria-label="Cart">🛒<span class="cnt" id="cartCnt">0</span></button>
  </div>
</header>

<main id="top">
  <div class="hero" id="hero"><div class="wrap" id="heroIn"></div></div>
  <section id="outlets" hidden><div class="wrap"><h2 data-t="outletsT" style="text-align:center"></h2><p class="sub" data-t="outletsS" style="text-align:center"></p><div id="outletList"></div></div></section>
  <section id="promos" hidden><div class="wrap"><h2 data-t="promosT"></h2><p class="sub" data-t="promosS"></p><div class="promos" id="promoList"></div></div></section>
  <section id="menu"><div class="wrap"><h2 data-t="menuT"></h2><p class="sub" data-t="menuS"></p><div class="cats" id="cats"></div><div id="menuList"></div></div></section>
  <section id="booking" style="background:#FBF1E4"><div class="wrap"><h2 data-t="bookT"></h2><p class="sub" data-t="bookS"></p><div class="card"><div class="form" id="bookForm"></div></div></div></section>
  <section id="about"><div class="wrap"><h2 data-t="aboutT"></h2><div id="story"></div><div class="gal" id="gallery"></div></div></section>
  <section id="contact" style="background:#FBF1E4"><div class="wrap two">
    <div><h2 data-t="hoursT"></h2><table class="hrs" id="hours"></table></div>
    <div><h2 data-t="contactT"></h2><div id="contactInfo"></div></div>
  </div></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<button class="btn fab" id="fab"></button>
<div class="ov" id="ov"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const S = window.SITE || {};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
const CUR = (S.ordering&&S.ordering.currency)||"RM";
const money = n => CUR+" "+(Math.round(n*100)/100).toFixed(2);

/* ---------- 文字（中/英） ---------- */
const T = {
  zh:{menuT:"菜单",menuS:"点击 + 加入购物车，可网上下单到店自取",promosT:"优惠活动",promosS:"最新优惠与节日套餐",bookT:"网上订位",bookS:"填好资料后会打开 WhatsApp，把订位资料发给我们确认",aboutT:"关于我们",hoursT:"营业时间",contactT:"联系我们",outletsT:"门店地址",outletsS:"共 {n} 间分店，点「导航」用 Google Maps 带路",navOutlet:"门店",outletBtn:"门店地址",outlet:"分店",chooseOutlet:"请选择分店",needOutlet:"请选择分店",nav:"导航",allOutlets:"查看全部 {n} 间分店",
      navMenu:"菜单",navPromo:"优惠",navBook:"订位",navAbout:"关于",navContact:"联系",
      open:"营业中",closed:"已打烊",closedToday:"今天休息",opensAt:"营业至",nextOpen:"下次营业",orderNow:"网上点餐",bookNow:"订位",
      days:["星期日","星期一","星期二","星期三","星期四","星期五","星期六"],rest:"休息",
      name:"姓名",phone:"电话",date:"日期",time:"时间",pax:"人数",remark:"备注 (选填)",remarkPh:"例如：要婴儿椅、有长辈",
      sendWa:"通过 WhatsApp 发送",noSlot:"这天没有可选时间",
      cart:"我的订单 (自取)",empty:"购物车是空的，去菜单挑几样吧！",total:"合计",pickupDate:"自取日期",pickupTime:"自取时间",
      checkout:"WhatsApp 下单",clear:"清空",viewCart:"查看订单",soldOut:"售完",added:"已加入",
      needName:"请填写姓名",needPhone:"请填写有效电话号码",needTime:"请选择时间",needItems:"购物车是空的",
      paxMore:"超过 {n} 位请直接打电话订位",
      waNote:"送出后店员会在 WhatsApp 回复确认，确认后才算成功。",
      call:"打电话",wa:"WhatsApp",map:"在 Google Maps 打开",addr:"地址",
      waOrder:"【网上点餐 - 自取】",waBook:"【网上订位】",
      fb:"Facebook",ig:"Instagram",fp:"Foodpanda 外送",gf:"GrabFood 外送",follow:"关注我们 / 外送平台",
      until:"至",longTerm:"长期有效"},
  en:{menuT:"Menu",menuS:"Tap + to add to cart and order online for pickup",promosT:"Promotions",promosS:"Latest deals and festive sets",bookT:"Book a Table",bookS:"Your booking details will be sent to us on WhatsApp for confirmation",aboutT:"Our Story",hoursT:"Opening Hours",contactT:"Contact",outletsT:"Our Outlets",outletsS:"{n} outlets — tap “Directions” to open Google Maps",navOutlet:"Outlets",outletBtn:"Our outlets",outlet:"Outlet",chooseOutlet:"Choose an outlet",needOutlet:"Please choose an outlet",nav:"Directions",allOutlets:"See all {n} outlets",
      navMenu:"Menu",navPromo:"Promos",navBook:"Book",navAbout:"About",navContact:"Contact",
      open:"Open now",closed:"Closed",closedToday:"Closed today",opensAt:"Open until",nextOpen:"Next open",orderNow:"Order online",bookNow:"Book a table",
      days:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],rest:"Closed",
      name:"Name",phone:"Phone",date:"Date",time:"Time",pax:"Guests",remark:"Remarks (optional)",remarkPh:"e.g. baby chair needed",
      sendWa:"Send via WhatsApp",noSlot:"No available time on this day",
      cart:"My Order (Pickup)",empty:"Your cart is empty — pick something from the menu!",total:"Total",pickupDate:"Pickup date",pickupTime:"Pickup time",
      checkout:"Order via WhatsApp",clear:"Clear",viewCart:"View order",soldOut:"Sold out",added:"Added",
      needName:"Please enter your name",needPhone:"Please enter a valid phone number",needTime:"Please choose a time",needItems:"Your cart is empty",
      paxMore:"For more than {n} guests, please call us",
      waNote:"We'll reply on WhatsApp to confirm — it's only confirmed after our reply.",
      call:"Call",wa:"WhatsApp",map:"Open in Google Maps",addr:"Address",
      waOrder:"[Online Order - Pickup]",waBook:"[Table Booking]",
      fb:"Facebook",ig:"Instagram",fp:"Foodpanda Delivery",gf:"GrabFood Delivery",follow:"Follow us / Delivery",
      until:"to",longTerm:"Ongoing"}
};
let lang = store.get("site_lang","zh");
const t = k => (T[lang]&&T[lang][k]) || T.zh[k] || k;
const L = (o,k) => (lang==="en" && o[k+"En"]) ? o[k+"En"] : o[k];

/* ---------- 时间工具 ---------- */
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const toMin = s => {const [h,m]=s.split(":").map(Number);return h*60+m;};
const fromMin = m => pad(Math.floor(m/60))+":"+pad(m%60);
const parseYmd = s => {const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const hoursOf = day => (S.hours&&S.hours[day]) || null;
/* 某天可选的时间点；leadMin = 距离现在至少多少分钟；lastGap = 打烊前多少分钟停止接单 */
function slotsFor(dateStr, step, leadMin, lastGap){
  const d = parseYmd(dateStr), segs = hoursOf(d.getDay()); if(!segs) return [];
  const now = new Date(), isToday = ymd(now)===dateStr;
  const minNow = now.getHours()*60+now.getMinutes()+leadMin;
  const out = [];
  segs.forEach(([a,b])=>{
    const s=toMin(a), e=toMin(b)-lastGap;
    for(let m=Math.ceil(s/step)*step; m<=e; m+=step){ if(!isToday || m>=minNow) out.push(fromMin(m)); }
  });
  return out;
}
function openState(){
  const now=new Date(), m=now.getHours()*60+now.getMinutes(), segs=hoursOf(now.getDay());
  if(segs){ for(const [a,b] of segs){ if(m>=toMin(a)&&m<toMin(b)) return {open:true,until:b}; } }
  for(let i=0;i<8;i++){
    const d=new Date(now); d.setDate(now.getDate()+i); const sg=hoursOf(d.getDay()); if(!sg) continue;
    for(const [a] of sg){ if(i>0 || toMin(a)>m) return {open:false,next:(i===0?"":t("days")[d.getDay()]+" ")+a}; }
  }
  return {open:false};
}

/* ---------- 购物车 ---------- */
const allItems = {};
(S.menu||[]).forEach(c=>(c.items||[]).forEach(it=>{allItems[it.id]=it;}));
let cart = store.get("site_cart",{});
Object.keys(cart).forEach(id=>{ if(!allItems[id]||allItems[id].soldOut||!(cart[id]>0)) delete cart[id]; });
const saveCart = () => store.set("site_cart",cart);
const cartCount = () => Object.values(cart).reduce((a,b)=>a+b,0);
const cartTotal = () => Object.entries(cart).reduce((s,[id,q])=>s+(allItems[id]?allItems[id].price*q:0),0);
function setQty(id,q){
  if(!allItems[id]||allItems[id].soldOut) return;
  if(q<=0) delete cart[id]; else cart[id]=Math.min(q,99);
  saveCart(); refreshCart();
}
window.__site = {setQty:(id,d)=>{setQty(id,(cart[id]||0)+d); if(d>0) toast(t("added")+" ✓");}};

function waLink(text,outletIdx){ const o=outletIdx!==undefined&&outletIdx!==""?outlets()[+outletIdx]:null; const num=(o&&o.whatsapp)||S.whatsapp||""; return "https://wa.me/"+String(num).replace(/\D/g,"")+"?text="+encodeURIComponent(text); }
function openWa(text,outletIdx){ const u=waLink(text,outletIdx); const w=window.open(u,"_blank"); if(w){try{w.opener=null;}catch(e){}} else { window.location.href=u; } }
let toastT;
function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1400); }
const phoneOk = p => p.replace(/\D/g,"").length>=9;
const itemName = it => lang==="en" && it.nameEn ? it.nameEn : it.name;

/* ---------- 渲染 ---------- */
function renderHeader(){
  document.title = (lang==="en"&&S.nameEn?S.nameEn:S.name) || "Restaurant";
  document.querySelector('meta[name="description"]').setAttribute("content", L(S,"tagline")||"");
  document.documentElement.lang = lang==="en"?"en":"zh";
  if(S.logo){let ic=document.querySelector('link[rel="icon"]');if(!ic){ic=document.createElement("link");ic.rel="icon";document.head.appendChild(ic);}ic.href=S.logo;}
  $("brand").innerHTML = S.logo ? `<img src="${esc(S.logo)}" alt="${esc(S.name)}"><span>${esc(L(S,"name"))}</span>` : esc(L(S,"name"));
  const links=[["outlets","navOutlet",!outlets().length],["menu","navMenu"],["promos","navPromo",!activePromos().length],["booking","navBook",!(S.booking&&S.booking.enabled)],["about","navAbout"],["contact","navContact"]];
  $("nav").innerHTML = links.filter(l=>!l[2]).map(([id,k])=>`<a href="#${id}">${esc(t(k))}</a>`).join("");
  $("langBtn").textContent = lang==="en"?"中文":"EN";
  $("cartBtn").hidden = !(S.ordering&&S.ordering.enabled);
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=t(el.dataset.t).replace("{n}",outlets().length);});
}
function renderHero(){
  const st=openState();
  const stTxt = st.open ? `${t("open")} · ${t("opensAt")} ${st.until}` : (st.next?`${t("closed")} · ${t("nextOpen")} ${esc(st.next)}`:t("closed"));
  if(S.heroImage){ $("hero").classList.add("img"); $("hero").style.backgroundImage=`url("${encodeURI(S.heroImage)}")`; }
  $("heroIn").innerHTML = `
    ${S.logo?`<img class="hlogo" src="${esc(S.logo)}" alt="${esc(S.name)}">`:""}
    <div class="status"><span class="dot ${st.open?"on":"off"}"></span>${stTxt}</div>
    <h1>${esc(L(S,"name"))}</h1>
    <p>${esc(L(S,"tagline"))}</p>
    <div class="acts">
      ${S.ordering&&S.ordering.enabled?`<a class="btn" href="#menu" style="background:var(--a);color:var(--dk)">🛍️ ${esc(t("orderNow"))}</a>`:""}
      ${S.booking&&S.booking.enabled?`<a class="btn alt" href="#booking">📅 ${esc(t("bookNow"))}</a>`:""}
      ${outlets().length?`<a class="btn alt" href="#outlets">📍 ${esc(t("outletBtn"))}</a>`:""}
    </div>`;
}
function outlets(){ return Array.isArray(S.outlets)?S.outlets:[]; }
const outletMap = o => o.map || ("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((S.nameEn||S.name||"")+" "+o.address));
const outletLabel = o => (lang==="en"&&o.nameEn)?o.nameEn:o.name;
function outletOptions(sel){
  return `<option value="">${esc(t("chooseOutlet"))}</option>`+outlets().map((o,i)=>`<option value="${i}" ${String(i)===String(sel)?"selected":""}>${esc(L(o,"region")?L(o,"region")+" · ":"")}${esc(outletLabel(o))}</option>`).join("");
}
function renderOutlets(){
  const os=outlets(); $("outlets").hidden=!os.length; if(!os.length) return;
  const groups=[]; os.forEach(o=>{ let g=groups.find(x=>x.region===(o.region||"")); if(!g){g={region:o.region||"",regionEn:o.regionEn,items:[]};groups.push(g);} g.items.push(o); });
  $("outletList").innerHTML = groups.map(g=>`${g.region?`<h3 class="region">❖ ${esc(L(g,"region"))} ❖<small>${g.items.length} ${lang==="en"?(g.items.length>1?"outlets":"outlet"):"间"}</small></h3>`:""}
    <div class="olist${g.items.length===1?" one":""}">${g.items.map(o=>{const wa=o.whatsapp?String(o.whatsapp).replace(/\D/g,""):"";return `<div class="outlet">
      <h3>${esc(outletLabel(o))}</h3>
      ${o.hours?`<div class="ln">🕐 ${esc(o.hours)}</div>`:""}
      ${o.phone?`<div class="ln">📞 ${esc(o.phone)}</div>`:""}
      <div class="ad">📍 ${esc(o.address)}</div>
      <div class="acts"><a class="btn alt" href="${esc(outletMap(o))}" target="_blank" rel="noopener">🧭 ${esc(t("nav"))}</a>${wa?`<a class="btn wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">💬 WhatsApp</a>`:""}</div>
    </div>`;}).join("")}</div>`).join("");
}
function activePromos(){
  const today=ymd(new Date());
  return (S.promos||[]).filter(p=>(!p.from||p.from<=today)&&(!p.to||p.to>=today));
}
function renderPromos(){
  const ps=activePromos(); $("promos").hidden=!ps.length;
  $("promoList").innerHTML = ps.map(p=>`<div class="promo">${p.image?`<img src="${esc(p.image)}" alt="" loading="lazy">`:""}
    <div class="in"><h3>${esc(L(p,"title"))}</h3><div>${esc(L(p,"body"))}</div>
    <div class="dt">${p.to?`${esc(p.from||"")} ${esc(t("until"))} ${esc(p.to)}`:esc(t("longTerm"))}</div></div></div>`).join("");
}
function renderMenu(){
  const on = S.ordering&&S.ordering.enabled;
  $("cats").innerHTML = (S.menu||[]).map((c,i)=>`<button data-i="${i}">${esc(L(c,"cat"))}</button>`).join("");
  $("menuList").innerHTML = (S.menu||[]).map((c,i)=>`<div class="mcat" id="cat-${i}"><h3>${esc(L(c,"cat"))}</h3><div class="grid">${
    (c.items||[]).map(it=>{
      const q=cart[it.id]||0, id=esc(it.id).replace(/'/g,"");
      return `<div class="item"><div class="ph">${it.image?`<img src="${esc(it.image)}" alt="${esc(it.name)}" loading="lazy">`:"🍲"}
        ${it.tag?`<span class="tag">${esc(it.tag)}</span>`:""}${it.soldOut?`<div class="so">${esc(t("soldOut"))}</div>`:""}</div>
        <div class="in"><h4>${esc(itemName(it))}</h4>${lang!=="en"&&it.nameEn?`<div class="en">${esc(it.nameEn)}</div>`:""}
        ${it.desc?`<div class="ds">${esc(it.desc)}</div>`:""}
        <div class="ft"><span class="price">${money(it.price)}</span>${on&&!it.soldOut?`<span class="qty">${q?`<button class="minus" onclick="__site.setQty('${id}',-1)" aria-label="-">−</button><b>${q}</b>`:""}<button onclick="__site.setQty('${id}',1)" aria-label="+">+</button></span>`:""}</div></div></div>`;
    }).join("")}</div></div>`).join("");
  $("cats").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const el=$("cat-"+b.dataset.i); window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-120,behavior:"smooth"});
  });
}
function dateOptions(minAhead,maxAhead,sel,step,lead,gap){
  const out=[], now=new Date();
  for(let i=minAhead;i<=maxAhead;i++){
    const d=new Date(now); d.setDate(now.getDate()+i); const s=ymd(d);
    if(!slotsFor(s,step,lead,gap).length) continue;
    out.push(`<option value="${s}" ${s===sel?"selected":""}>${s} ${t("days")[d.getDay()]}</option>`);
  }
  return out;
}
function timeOptions(date,step,lead,gap,sel){
  const sl = date ? slotsFor(date,step,lead,gap) : [];
  return sl.length ? sl.map(s=>`<option ${s===sel?"selected":""}>${s}</option>`).join("") : `<option value="">${esc(t("noSlot"))}</option>`;
}
const BK = () => Object.assign({maxPax:20,minDaysAhead:0,maxDaysAhead:30,slotMinutes:30},S.booking||{});
function renderBooking(){
  if(!(S.booking&&S.booking.enabled)){ $("booking").hidden=true; return; }
  const b=BK(), keep=store.get("site_guest",{});
  const dates=dateOptions(b.minDaysAhead,b.maxDaysAhead,"",b.slotMinutes,60,60);
  const d0 = dates.length ? dates[0].match(/value="([^"]+)"/)[1] : "";
  let paxOpt=""; for(let i=1;i<=b.maxPax;i++) paxOpt+=`<option>${i}</option>`;
  $("bookForm").innerHTML = `
    <div><label>${esc(t("name"))}</label><input id="bk_name" autocomplete="name" value="${esc(keep.name||"")}"></div>
    <div><label>${esc(t("phone"))}</label><input id="bk_phone" type="tel" autocomplete="tel" value="${esc(keep.phone||"")}"></div>
    ${outlets().length?`<div class="full"><label>${esc(t("outlet"))}</label><select id="bk_outlet">${outletOptions(keep.outlet)}</select></div>`:""}
    <div><label>${esc(t("date"))}</label><select id="bk_date">${dates.join("")}</select></div>
    <div><label>${esc(t("time"))}</label><select id="bk_time">${timeOptions(d0,b.slotMinutes,60,60)}</select></div>
    <div><label>${esc(t("pax"))}</label><select id="bk_pax">${paxOpt}</select><div class="note">${esc(t("paxMore").replace("{n}",b.maxPax))}</div></div>
    <div><label>${esc(t("remark"))}</label><input id="bk_note" placeholder="${esc(t("remarkPh"))}"></div>
    <div class="full err" id="bk_err"></div>
    <div class="full"><button class="btn wa" id="bk_send">💬 ${esc(t("sendWa"))}</button><div class="note" style="margin-top:8px">${esc(t("waNote"))}</div></div>`;
  $("bk_date").onchange=e=>{$("bk_time").innerHTML=timeOptions(e.target.value,b.slotMinutes,60,60);};
  $("bk_send").onclick=()=>{
    const name=$("bk_name").value.trim(), phone=$("bk_phone").value.trim(), date=$("bk_date").value, time=$("bk_time").value;
    const oi=$("bk_outlet")?$("bk_outlet").value:undefined;
    const err = (oi==="")?t("needOutlet"):!name?t("needName"):!phoneOk(phone)?t("needPhone"):(!date||!time)?t("needTime"):"";
    $("bk_err").textContent=err; if(err) return;
    store.set("site_guest",{name,phone,outlet:oi});
    const d=parseYmd(date);
    openWa([t("waBook"),oi!==undefined?`${t("outlet")}: ${outlets()[+oi].name}`:null,`${t("name")}: ${name}`,`${t("phone")}: ${phone}`,`${t("date")}: ${date} (${t("days")[d.getDay()]})`,`${t("time")}: ${time}`,`${t("pax")}: ${$("bk_pax").value}`,$("bk_note").value.trim()?`${t("remark").replace(/\s*\(.*\)/,"")}: ${$("bk_note").value.trim()}`:""].filter(Boolean).join("\n"), oi);
  };
}
function renderAbout(){
  $("story").innerHTML = (L(S,"story")||[]).map(p=>`<p>${esc(p)}</p>`).join("");
  $("gallery").innerHTML = (S.gallery||[]).map(g=>`<figure><img src="${esc(g.src)}" alt="${esc(g.caption||"")}" loading="lazy">${g.caption?`<figcaption>${esc(g.caption)}</figcaption>`:""}</figure>`).join("");
  $("gallery").hidden = !(S.gallery||[]).length;
}
function renderContact(){
  const today=new Date().getDay(), order=[1,2,3,4,5,6,0];
  $("hours").innerHTML = order.map(d=>{const h=hoursOf(d);return `<tr class="${d===today?"today":""}"><td>${esc(t("days")[d])}</td><td>${h?h.map(x=>esc(x[0]+" – "+x[1])).join(", "):esc(t("rest"))}</td></tr>`;}).join("");
  const so=S.social||{}, soc=[["facebook","fb","📘"],["instagram","ig","📸"],["foodpanda","fp","🐼"],["grabfood","gf","🛵"]].filter(x=>so[x[0]]);
  $("contactInfo").innerHTML = `
    ${S.address?`<p><b>${esc(t("addr"))}:</b> ${esc(S.address)}</p>`:""}
    ${outlets().length?`<p><a class="btn alt" href="#outlets">📍 ${esc(t("allOutlets").replace("{n}",outlets().length))}</a></p>`:""}
    <div style="display:flex;flex-wrap:wrap;gap:10px">
      ${S.phone?`<a class="btn alt" href="tel:${esc(String(S.phone).replace(/[^\d+]/g,""))}">📞 ${esc(t("call"))}</a>`:""}
      ${S.whatsapp?`<a class="btn wa" href="${esc(waLink(""))}" target="_blank" rel="noopener">💬 ${esc(t("wa"))}</a>`:""}
      ${S.mapLink?`<a class="btn alt" href="${esc(S.mapLink)}" target="_blank" rel="noopener">📍 ${esc(t("map"))}</a>`:""}
    </div>
    ${S.mapEmbed?`<iframe class="map" src="${esc(S.mapEmbed)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="map"></iframe>`:""}
    ${soc.length?`<h3 style="margin:22px 0 0">${esc(t("follow"))}</h3><div class="social">${soc.map(([k,lb,ic])=>`<a class="s-${k}" href="${esc(so[k])}" target="_blank" rel="noopener">${ic} ${esc(t(lb))}</a>`).join("")}</div>`:""}`;
  $("foot").innerHTML = `<b>${esc(L(S,"name"))}</b>${S.address?" · "+esc(S.address):(outlets().length?" · "+esc(t("outletsT"))+" "+outlets().length:"")}<br>${S.phone?esc(S.phone)+" · ":""}© ${new Date().getFullYear()}`;
}

/* ---------- 购物车抽屉 ---------- */
const OD = () => Object.assign({pickupLeadMinutes:30},S.ordering||{});
let drawerOpen=false;
function refreshCart(){
  const n=cartCount();
  $("cartCnt").textContent=n; $("cartCnt").style.display=n?"":"none";
  $("fab").textContent=`🛒 ${t("viewCart")} · ${n} · ${money(cartTotal())}`;
  $("fab").classList.toggle("show", n>0 && !drawerOpen && !!(S.ordering&&S.ordering.enabled));
  renderMenu();
  if(drawerOpen) renderDrawer();
}
function renderDrawer(){
  const o=OD(), ids=Object.keys(cart), keep=store.get("site_guest",{});
  const prevDate=$("od_date")?$("od_date").value:"", prevTime=$("od_time")?$("od_time").value:"";
  const prevOutlet=$("od_outlet")?$("od_outlet").value:(keep.outlet!==undefined?keep.outlet:"");
  const prev={name:$("od_name")?$("od_name").value:keep.name||"",phone:$("od_phone")?$("od_phone").value:keep.phone||"",note:$("od_note")?$("od_note").value:""};
  const dates=dateOptions(0,2,prevDate,15,o.pickupLeadMinutes,15);
  const d0 = prevDate || (dates.length?dates[0].match(/value="([^"]+)"/)[1]:"");
  $("drawer").innerHTML = `<h3>${esc(t("cart"))}<button class="x" id="dx" aria-label="close">✕</button></h3>
    ${ids.length? ids.map(id=>{const it=allItems[id];const sid=esc(id).replace(/'/g,"");return `<div class="cl"><div class="nm">${esc(itemName(it))}<div class="note">${money(it.price)}</div></div>
      <span class="qty"><button class="minus" onclick="__site.setQty('${sid}',-1)">−</button><b>${cart[id]}</b><button onclick="__site.setQty('${sid}',1)">+</button></span>
      <b style="min-width:76px;text-align:right">${money(it.price*cart[id])}</b></div>`;}).join("")
      + `<div class="tot"><span>${esc(t("total"))}</span><span>${money(cartTotal())}</span></div>
      <div class="form">
        <div><label>${esc(t("name"))}</label><input id="od_name" autocomplete="name" value="${esc(prev.name)}"></div>
        <div><label>${esc(t("phone"))}</label><input id="od_phone" type="tel" autocomplete="tel" value="${esc(prev.phone)}"></div>
        ${outlets().length?`<div class="full"><label>${esc(t("outlet"))}</label><select id="od_outlet">${outletOptions(prevOutlet)}</select></div>`:""}
        <div><label>${esc(t("pickupDate"))}</label><select id="od_date">${dates.join("")}</select></div>
        <div><label>${esc(t("pickupTime"))}</label><select id="od_time">${timeOptions(d0,15,o.pickupLeadMinutes,15,prevTime)}</select></div>
        <div class="full"><label>${esc(t("remark"))}</label><input id="od_note" value="${esc(prev.note)}"></div>
        <div class="full err" id="od_err"></div>
        <div class="full" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn wa" id="od_send" style="flex:1">💬 ${esc(t("checkout"))}</button><button class="btn alt" id="od_clear">${esc(t("clear"))}</button></div>
        <div class="full note">${esc(t("waNote"))}</div>
      </div>`
    : `<p class="note" style="font-size:15px;padding:20px 0">${esc(t("empty"))}</p>`}`;
  $("dx").onclick=closeDrawer;
  if(!ids.length) return;
  $("od_date").onchange=e=>{$("od_time").innerHTML=timeOptions(e.target.value,15,o.pickupLeadMinutes,15);};
  $("od_clear").onclick=()=>{cart={};saveCart();refreshCart();};
  $("od_send").onclick=()=>{
    const name=$("od_name").value.trim(), phone=$("od_phone").value.trim(), date=$("od_date").value, time=$("od_time").value;
    const oi=$("od_outlet")?$("od_outlet").value:undefined;
    const err = !Object.keys(cart).length?t("needItems"):(oi==="")?t("needOutlet"):!name?t("needName"):!phoneOk(phone)?t("needPhone"):(!date||!time)?t("needTime"):"";
    $("od_err").textContent=err; if(err) return;
    store.set("site_guest",{name,phone,outlet:oi});
    const lines=Object.entries(cart).map(([id,q])=>`• ${allItems[id].name}${allItems[id].nameEn?" ("+allItems[id].nameEn+")":""} x${q} = ${money(allItems[id].price*q)}`);
    const note=$("od_note").value.trim();
    openWa([t("waOrder"),oi!==undefined?`${t("outlet")}: ${outlets()[+oi].name}`:null,...lines,`${t("total")}: ${money(cartTotal())}`,"",`${t("name")}: ${name}`,`${t("phone")}: ${phone}`,`${t("pickupDate")}: ${date}`,`${t("pickupTime")}: ${time}`,note?`${t("remark").replace(/\s*\(.*\)/,"")}: ${note}`:null].filter(x=>x!==null).join("\n"), oi);
  };
}
function openDrawer(){ drawerOpen=true; renderDrawer(); $("drawer").classList.add("show"); $("ov").classList.add("show"); document.body.style.overflow="hidden"; refreshCartFab(); }
function closeDrawer(){ drawerOpen=false; $("drawer").classList.remove("show"); $("ov").classList.remove("show"); document.body.style.overflow=""; refreshCartFab(); }
function refreshCartFab(){ $("fab").classList.toggle("show", cartCount()>0 && !drawerOpen && !!(S.ordering&&S.ordering.enabled)); }

function renderAll(){ renderHeader(); renderHero(); renderOutlets(); renderPromos(); refreshCart(); renderBooking(); renderAbout(); renderContact(); }

/* ---------- 事件 ---------- */
if(S.theme){ const r=document.documentElement.style; if(S.theme.primary) r.setProperty("--p",S.theme.primary); if(S.theme.accent) r.setProperty("--a",S.theme.accent); if(S.theme.dark) r.setProperty("--dk",S.theme.dark); }
$("langBtn").onclick=()=>{lang=lang==="en"?"zh":"en";store.set("site_lang",lang);renderAll();};
$("cartBtn").onclick=openDrawer; $("fab").onclick=openDrawer; $("ov").onclick=closeDrawer;
$("menuToggle").onclick=()=>$("nav").classList.toggle("open");
$("nav").addEventListener("click",e=>{ if(e.target.tagName==="A") $("nav").classList.remove("open"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&drawerOpen) closeDrawer(); });
setInterval(renderHero,60000);
renderAll();
})();
</script>
</body>
</html>
