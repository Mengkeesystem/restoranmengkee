<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>退款政策及隐私说明 · 明记家乡小食店 Meng Kee Restaurant</title>
<meta name="description" content="明记家乡小食店网上点餐的退款及取消政策、隐私说明。Refund & cancellation policy and privacy notice.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<script>document.write('<script src="config.js?v='+Math.floor(Date.now()/60000)+'"><\/script>');</script>
<style>
:root{--p:#B4232A;--a:#F2B417;--dk:#2A1A14;--bg:#FFFBF5;--tx:#2A1A14;--mut:#7A6A60;--line:#E3D3C2;--r:3px;--serif:"Noto Serif SC","Songti SC","STSong",serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}
a{color:var(--p)}
header{background:var(--p);color:#fff;border-bottom:3px solid var(--a)}
header .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
header img{width:40px;height:40px;border-radius:var(--r)}
header b{font-family:var(--serif);font-size:18px;flex:1}
header a,header button{color:#fff;font:inherit;font-size:14px;background:none;border:1px solid rgba(255,255,255,.6);border-radius:var(--r);padding:6px 10px;text-decoration:none;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding-left:16px;padding-right:16px}
nav.toc{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 4px}
nav.toc a{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:6px 12px;text-decoration:none;font-size:14px}
section{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:3px 3px 0 var(--line);padding:6px 20px 16px;margin:20px 0;scroll-margin-top:16px}
h1{font-family:var(--serif);font-size:24px;margin:14px 0 4px;border-left:4px solid var(--a);padding-left:10px}
h2{font-size:17px;margin:18px 0 6px}
ul{margin:0;padding-left:20px}
li{margin:4px 0}
.meta{color:var(--mut);font-size:13px;margin:0 0 6px}
.contact{background:#FBF1E4;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:20px 0 32px}
.contact a.wa{display:inline-block;margin-top:8px;background:#25D366;color:#fff;text-decoration:none;border-radius:var(--r);padding:8px 14px;font-weight:700}
footer{background:var(--dk);color:#E9DCCF;padding:20px 0 calc(20px + env(safe-area-inset-bottom));font-size:13px}
</style>
</head>
<body>
<header><div class="wrap"><img id="logo" alt=""><b id="shop"></b><button id="langBtn" type="button"></button><a href="./" id="back"></a></div></header>
<main class="wrap">
  <nav class="toc"><a href="#refund" id="tocR"></a><a href="#privacy" id="tocP"></a></nav>
  <section id="refund"></section>
  <section id="privacy"></section>
  <div class="contact" id="contact"></div>
</main>
<footer><div class="wrap" id="foot"></div></footer>
<script>
(function(){
  "use strict";
  const S=window.SITE||{}, P=S.policies||{};
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let lang="zh"; try{ lang=JSON.parse(localStorage.getItem("site_lang"))==="en"?"en":"zh"; }catch(e){}
  const q=new URLSearchParams(location.search).get("lang"); if(q==="en"||q==="zh") lang=q;
  const L=(o,k)=>(lang==="en"&&o&&o[k+"En"])?o[k+"En"]:(o?o[k]:"");
  const $=id=>document.getElementById(id);
  const T={zh:{back:"返回首页",lang:"EN",upd:"最后更新",legal:"营业者",contact:"有任何问题、取消或退款要求，请联系我们：",wa:"💬 WhatsApp 联系我们",tel:"电话"},
           en:{back:"Back to home",lang:"中文",upd:"Last updated",legal:"Operated by",contact:"For questions, cancellations or refund requests, please contact us:",wa:"💬 Contact us on WhatsApp",tel:"Phone"}};
  function sec(o){
    if(!o) return "";
    return `<h1>${esc(L(o,"title"))}</h1>`+
      `<p class="meta">${esc(T[lang].upd)}: ${esc(P.updated||"")}${P.legalName?` · ${esc(T[lang].legal)}: ${esc(P.legalName)}`:""}</p>`+
      (o.sections||[]).map(x=>`<h2>${esc(L(x,"h"))}</h2><ul>${((lang==="en"&&x.pEn)?x.pEn:x.p||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`).join("");
  }
  function render(){
    document.documentElement.lang=lang==="en"?"en":"zh";
    const name=L(S,"name")||"";
    $("logo").src=S.logo||"images/logo.png"; $("shop").textContent=name;
    $("back").textContent=T[lang].back; $("langBtn").textContent=T[lang].lang;
    $("tocR").textContent=L(P.refund,"title"); $("tocP").textContent=L(P.privacy,"title");
    $("refund").innerHTML=sec(P.refund); $("privacy").innerHTML=sec(P.privacy);
    const wa=String(S.whatsapp||"").replace(/\D/g,"");
    $("contact").innerHTML=`${esc(T[lang].contact)}<br>`+
      (S.phone?`${esc(T[lang].tel)}: ${esc(S.phone)}<br>`:"")+
      (wa?`<a class="wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">${esc(T[lang].wa)} (+${esc(wa)})</a>`:"");
    $("foot").innerHTML=`<b>${esc(name)}</b>${P.legalName?" · "+esc(P.legalName):""} · © ${new Date().getFullYear()}`;
    document.title=`${L(P.refund,"title")} · ${L(P.privacy,"title")} · ${name}`;
  }
  $("langBtn").onclick=()=>{ lang=lang==="en"?"zh":"en"; try{localStorage.setItem("site_lang",JSON.stringify(lang));}catch(e){} render(); };
  render();
  if(location.hash){ const el=document.getElementById(location.hash.slice(1)); if(el) el.scrollIntoView(); }
})();
</script>
</body>
</html>
