<title>找不到这个页面 · 明记家乡小食店 Meng Kee</title>
<!-- 打错网址时 GitHub Pages 会显示这一页。用绝对路径（/images/…），这样不管网址多深都找得到图片 -->
<style>
:root{--p:#B4232A;--a:#F2B417;--dk:#2A1A14;--bg:#FFFBF5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--dk);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;text-align:center}
.box{max-width:420px;width:100%;background:#fff;border:1px solid #E3D3C2;border-top:4px solid var(--a);padding:32px 24px;box-shadow:3px 3px 0 rgba(180,35,42,.12);border-radius:3px}
img{width:84px;height:84px;border:2px solid var(--a);border-radius:3px}
h1{margin:16px 0 4px;font-size:22px;font-family:"Noto Serif SC","Songti SC",serif;color:var(--p)}
p{margin:6px 0;color:#7A6A60;line-height:1.6}
.en{font-size:14px}
a{display:inline-block;margin-top:18px;padding:12px 26px;background:var(--p);color:#fff;font-weight:700;text-decoration:none;border-radius:3px}
a:hover{background:#8f1b21}
</style>
</head>
<body>
<div class="box">
  <img src="/images/logo.png" alt="明记 Meng Kee">
  <h1>找不到这个页面</h1>
  <p>网址可能打错了，或者这个页面已经不在了。</p>

  <a href="/">回到首页 · Back to home</a>
</div>
</body>
