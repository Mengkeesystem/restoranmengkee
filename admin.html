<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>店员后台 · 付款确认</title>
<link rel="icon" href="images/logo.png">
<!-- 员工后台做成可安装的 App（2026-10-31）：Android「安装 App」、iPhone「加到主画面」 -->
<link rel="manifest" href="admin.webmanifest">
<meta name="theme-color" content="#B4232A">
<link rel="apple-touch-icon" href="images/app-apple-180.png">

<style>
:root{--p:#B4232A;--a:#F2B417;--dk:#2A1A14;--bg:#FFFBF5;--tx:#2A1A14;--mut:#7A6A60;--line:#E3D3C2;--ok:#1F8A4C;--r:3px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:3px solid var(--a);display:flex;align-items:center;gap:10px;padding:10px 16px}
header img{height:36px}
header b{color:var(--p);font-size:17px}
header .sp{flex:1}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.btn{border:0;border-radius:var(--r);padding:10px 16px;font-weight:800;font-size:15px;cursor:pointer;min-height:42px;background:var(--p);color:#fff;font-family:inherit}
.btn.alt{background:#fff;color:var(--p);border:2px solid var(--p)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.5}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:3px 3px 0 rgba(180,35,42,.10)}
input,select{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);font-family:inherit;background:#fff}
label{font-weight:700;font-size:14px;display:block;margin:10px 0 4px}
.err{color:var(--p);min-height:20px;font-size:14px;margin-top:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:#fff;padding:8px 14px;font-weight:800;border-radius:var(--r);cursor:pointer;font-family:inherit;font-size:14px}
.tabs button.on{background:var(--p);border-color:var(--p);color:#fff}
.tabs .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;background:var(--a);color:var(--dk);border-radius:2px;font-size:12px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar select{width:auto;min-width:200px}
.live{font-size:13px;color:var(--mut)}
.live i{display:inline-block;width:8px;height:8px;background:var(--ok);border-radius:50%;margin-right:6px;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}
.ord{background:#fff;border:1px solid var(--line);border-left:6px solid var(--a);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:3px 3px 0 rgba(180,35,42,.08)}
.ord.paid{border-left-color:var(--ok)}
.ord.rejected{border-left-color:#999;opacity:.8}
.ord.new{animation:flash 1.2s 3}
@keyframes flash{50%{background:#FFF3C4}}
.oh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ref{font-size:20px;font-weight:900;letter-spacing:1px}
.amt{font-size:26px;font-weight:900;color:var(--p);white-space:nowrap}
.meta{font-size:14px;color:var(--mut);margin-top:4px}
.meta b{color:var(--tx)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:2px;margin-left:6px;vertical-align:middle}
.tag.pending{background:#FFF0C2;color:#8A5A00}.tag.paid{background:#E2F5E9;color:var(--ok)}.tag.rejected{background:#eee;color:#666}.tag.done{background:#DDEBFF;color:#1F4E9A}.tag.old{background:#FDE2E2;color:var(--p)}
details{margin-top:8px}
summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--p)}
pre{white-space:pre-wrap;word-break:break-word;background:#FFFBF0;border:1px solid var(--line);padding:10px;font-size:13.5px;margin:8px 0 0;font-family:inherit}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:140px}
.who{font-size:12px;color:var(--mut);margin-top:6px}
.cour{margin-top:10px;padding:10px;border:1px dashed var(--line);background:#FFFDF6;font-size:14px}.cour .mut,.mut{color:var(--mut);font-size:13px}.cour .acts{margin-top:8px}.cour .err{margin-top:4px}
.sim{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:8px;border-top:1px dashed var(--line)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:3px 3px 0 rgba(180,35,42,.08)}
.kpi span{display:block;font-size:13px;color:var(--mut)}.kpi b{font-size:22px;color:var(--p)}.kpi small{display:block;color:var(--mut);font-size:12px}
.sumsec{margin-bottom:16px}.sumsec h3{margin:0 0 8px;font-size:16px;color:var(--p)}
.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:14px}.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left}.tbl th{background:#FFF6DA}.tbl td.n{text-align:right;white-space:nowrap}
.tblw{overflow-x:auto}
.role{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;margin-right:6px;border:1px solid var(--a);background:#FFF6DA;color:#7A4B00}
.role.mgr{border-color:var(--line);background:#F3ECE4;color:var(--dk)}
.stf{display:grid;gap:8px}
.stf .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);padding:10px 12px}
.stf .row b{flex:1 1 220px;word-break:break-all}
.stf .row .outs{flex:1 1 100%;font-size:13px;color:var(--mut)}
.ochk{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin:6px 0 10px}
.ochk label{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;border:1px solid var(--line);padding:6px 8px;background:#fff;margin:0}
.ochk input{width:auto;margin:0}
.ibox{position:fixed;inset:0;z-index:50;background:rgba(20,11,8,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.ibox>div{background:#fff;max-width:380px;width:100%;border-top:4px solid var(--a);padding:18px;box-shadow:6px 6px 0 rgba(0,0,0,.3)}
.ibox ol{padding-left:20px;margin:8px 0 14px;line-height:1.8}
@media(max-width:560px){header{flex-wrap:wrap;padding:8px 12px;gap:6px}header b{font-size:15px}header img{height:30px}}
.cnote{background:#FFF6DA;border:1px solid var(--a);border-left:5px solid var(--a);padding:8px 12px;margin:8px 0;font-size:15px}
.cnote .cn1{font-size:16px;font-weight:700;color:#7A2E00;margin-top:2px}
.cnote .cn2{font-size:14px;margin-top:2px}
.hint{background:#FFF6DA;border:1px solid var(--a);padding:10px 12px;font-size:14px;margin-bottom:12px}
.m86h{margin:18px 0 8px;font-size:16px;color:var(--p);border-left:4px solid var(--a);padding-left:8px}
.m86grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.m86i{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-left:4px solid #1F8A4C;padding:10px 12px}
.m86i.isoff{border-left-color:var(--p);background:#FDF6F6}
.m86b{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.m86s{display:inline-block;margin-top:3px;font-size:12px;font-weight:800;padding:1px 8px;border-radius:2px}
.m86s.on{background:#EEF8F1;color:#14532D}.m86s.off{background:#F9E3E3;color:var(--p)}.m86s.part{background:#FFF6DA;color:#7A4B00}
.m86t{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2A1A14;color:#fff;padding:12px 18px;font-weight:700;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}.m86t.show{opacity:1}
#m86View .bar label{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

/* ===== 出餐拍照 + 退款（2026-11-01）===== */
.proof{margin-top:10px;padding:10px;border:1px dashed var(--line);background:#FFFDF6;font-size:14px}
.proof.need{border:2px solid var(--p);background:#FDF1F1}
.proof.ok{border-style:solid;border-color:#BFE3CB;background:#F3FBF6}
.proof .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 2px}
.pth{width:84px;height:84px;object-fit:cover;border:1px solid var(--line);border-radius:var(--r);background:#eee;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px}
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:8px}
.lb img{max-width:100%;max-height:82vh;object-fit:contain}
.lb span{color:#fff;font-size:13px}
.rfd{margin-top:8px;padding:8px 10px;border-left:4px solid #8A5A00;background:#FFF6DA;font-size:13.5px}
.tag.rf{background:#FFE9C7;color:#7A4B00}
.ibox label.rl{margin-top:8px}
.ibox textarea,.ibox select,.ibox input{margin-bottom:2px}
</style>
</head>
<body>
<header><img src="images/logo.png" alt=""><b id="hTitle">店员后台 · 付款确认</b><span class="sp"></span><button class="btn sm" id="instBtn" hidden>📲 安装 App</button><button class="btn alt sm" id="m86Btn" hidden>🍽️ 菜单开关</button><button class="btn alt sm" id="staffBtn" hidden>👥 店员</button><button class="btn alt sm" id="viewBtn" hidden>📊 每月总结</button><span id="hUser" class="live"></span><button class="btn alt sm" id="logoutBtn" hidden>登出</button></header>
<div class="wrap" id="app"></div>
<input type="file" id="shotIn" accept="image/*" capture="environment" hidden>

<script>
(function(){
"use strict";
const S = window.SITE || {}, B = S.backend || {};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const money = n => "RM " + (Math.round((+n)*100)/100).toFixed(2);
const app = $("app");
document.title = (S.name||"") + " · 店员后台";
$("hTitle").textContent = (S.name||"") + " · 付款确认";

if(!navigator.onLine && (!window.SITE || !window.supabase)){
  app.innerHTML = `<div class="card" style="text-align:center"><h2 style="margin-top:0;color:var(--p)">📶 没有网络</h2><p>员工后台要连线才看得到订单。请打开 Wi-Fi 或流量后再开一次。</p><button class="btn" onclick="location.reload()">🔄 重新连线</button></div>`;
  return;
}
if(!B.supabaseUrl || !B.supabaseAnonKey || !window.supabase){
  app.innerHTML = `<div class="card"><h2 style="margin-top:0;color:var(--p)">后台还没设定</h2><p>请先照 README「付款确认小后台」的步骤建好 Supabase 项目，并把网址和 anon key 填进 <code>config.js</code> 的 <code>backend</code>。</p></div>`;
  return;
}
const sb = window.supabase.createClient(B.supabaseUrl, B.supabaseAnonKey);
let me=null, role="admin", myOutlets=[], tab="pending", outletF="", orders=[], seen=new Set(), first=true, timer=null;

/* 提示音（新订单） */
/* 新订单提示音：清脆的「叮～当」两声（像小铃铛，不刺耳）。
   浏览器规定要先点过页面才能出声，所以用同一个 AudioContext，第一次点击就解锁；没解锁时页面上有「🔔 开启提示音」按钮。 */
let actx=null;
function audioCtx(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function soundOn(){ return !!(actx&&actx.state==="running"); }
function unlockSound(){ const c=audioCtx(); if(c&&c.state!=="running") c.resume().then(updSoundBtn,updSoundBtn); else updSoundBtn(); loadRing(); }
function bell(c,t0,f,vol){   /* 一个铃声：基音 + 两个泛音，快速起音、慢慢消失 */
  [[1,1],[2.76,.32],[5.4,.12]].forEach(([m,a])=>{ const o=c.createOscillator(),g=c.createGain(); o.type="sine"; o.frequency.value=f*m;
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol*a,t0+.008); g.gain.exponentialRampToValueAtTime(.0001,t0+(m===1?1.4:.6));
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+1.5); });
}
/* 新订单提示音（2026-11-02 业主换成自己的 5 秒声音 images/sound/new-order.mp3）：用同一个 AudioContext 播放（点过页面就解锁）。
   声音档还没载好 / 载不到 → 退回上面的「叮～当」铃声，不会没声音。要换声音：直接换掉这个 mp3（建议 ≤ 10 秒），并把下面 ?v= 加一。 */
let ringBuf=null, ringTried=false, ringSrc=null;
async function loadRing(){ if(ringBuf||ringTried) return ringBuf; ringTried=true;
  try{ const c=audioCtx(); if(!c) { ringTried=false; return null; } const r=await fetch("images/sound/new-order.mp3?v=1"); if(!r.ok) throw new Error("no sound"); ringBuf=await c.decodeAudioData(await r.arrayBuffer()); }catch(e){ ringBuf=null; }
  return ringBuf; }
function bellOld(){ const c=audioCtx(); const t=c.currentTime+.05; bell(c,t,1318.5,.16); bell(c,t+.28,1046.5,.14); }
function beep(){ try{ const c=audioCtx(); if(!c) return; if(c.state!=="running") c.resume();
  if(ringBuf){ try{ if(ringSrc) ringSrc.stop(); }catch(e){} ringSrc=c.createBufferSource(); ringSrc.buffer=ringBuf; ringSrc.connect(c.destination); ringSrc.start(); }
  else { bellOld(); loadRing(); } }catch(e){} }
function updSoundBtn(){ const b=$("sndBtn"); if(!b) return; const on=soundOn(); b.textContent=on?"🔔 提示音已开启 · 试听":"🔕 点这里开启提示音"; b.className="btn sm "+(on?"alt":""); }
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,unlockSound,{passive:true}));

function loginView(msg){
  $("logoutBtn").hidden=true; $("hUser").textContent="";
  app.innerHTML = `<div class="card" style="max-width:420px;margin:30px auto">
    <h2 style="margin-top:0;color:var(--p)">店员登录</h2>
    <label>邮箱</label><input id="em" type="email" autocomplete="username">
    <label>密码</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="lerr">${esc(msg||"")}</div>
    <button class="btn" id="lbtn" style="width:100%;margin-top:6px">登录</button>
    <p class="live" style="margin-top:14px">账号由老板在 Supabase 后台建立，并加入店员白名单才能使用。</p></div>`;
  const go=async()=>{ $("lbtn").disabled=true; $("lerr").textContent="";
    const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
    $("lbtn").disabled=false; if(error){ $("lerr").textContent="登录失败："+error.message; return; } boot(); };
  $("lbtn").onclick=go; $("pw").onkeydown=e=>{ if(e.key==="Enter") go(); };
}

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ loginView(); return; }
  me=session.user;
  const {data:ok, error} = await sb.rpc("is_web_staff");
  if(error||!ok){ await sb.auth.signOut(); loginView("这个账号不在店员白名单里，请联络老板。"); return; }
  /* 角色（2026-10-31，staff.sql）：admin 看全部分店；manager 只看自己的分店（数据库 RLS 本来就挡着，这里只是让画面对得上）。还没跑 staff.sql 就当 admin */
  { const r=await sb.rpc("web_staff_me"); const v=r.data;
    if(!r.error&&v&&typeof v==="object"){ role=v.role==="manager"?"manager":"admin"; myOutlets=Array.isArray(v.outlets)?v.outlets.map(Number).filter(Number.isInteger):[]; }
    else if(!r.error&&!v){ await sb.auth.signOut(); loginView("这个账号不在店员白名单里，请联络老板。"); return; }
    else { role="admin"; myOutlets=[]; } }
  const outs=S.outlets||[], mine=role==="admin"?outs:outs.filter((o,i)=>myOutlets.includes(i));
  $("hUser").innerHTML=`<span class="role ${role==="admin"?"":"mgr"}">${role==="admin"?"管理员 · 全部分店":"分店经理 · "+esc(mine.map(o=>o.name).join("、")||"未指定")}</span>${esc(me.email)}`; $("logoutBtn").hidden=false;
  $("staffBtn").hidden=role!=="admin"; $("staffBtn").onclick=()=>setView(view==="staff"?"orders":"staff");
  $("m86Btn").hidden=false; $("m86Btn").onclick=()=>setView(view==="m86"?"orders":"m86");
  if(role==="manager"&&mine.length===1){ outletF=mine[0].name; sumOutlet=mine[0].name; }
  $("logoutBtn").onclick=async()=>{ clearInterval(timer); try{ const ps=pushOK()?await pushSub():null; if(ps) await fnPush({action:"unsubscribe",endpoint:ps.endpoint}); }catch(e){}   /* 登出后这台手机不再收通知（下次登录会自动登记回来） */
    await sb.auth.signOut(); $("viewBtn").hidden=true; $("staffBtn").hidden=true; $("m86Btn").hidden=true; role="admin"; myOutlets=[]; outletF=""; sumOutlet=""; view="orders"; history.replaceState(null,"",location.pathname); loginView(); };
  app.innerHTML = `<div id="ordView"><div class="hint">🔔 客人在 HitPay 付款成功后，订单会<b>自动变成「已收款」并响铃</b>，不用手动确认。请保持这个页面开着（声音打开），或开启下面的「手机通知」（关掉网页、锁屏也会响）。客人不会另外发 WhatsApp，订单内容就在下面。</div>
    <div class="hint pushbox" id="pushBox" hidden></div>
    <div class="bar"><select id="of">${mine.length>1||role==="admin"?`<option value="">${role==="admin"?"全部分店":"我的全部分店"}</option>`:""}${mine.map(o=>`<option ${o.name===outletF?"selected":""}>${esc(o.name)}</option>`).join("")}</select><span class="live"><i></i>自动更新中（每 5 秒）</span><button type="button" id="sndBtn" class="btn sm">🔕 点这里开启提示音</button><button type="button" id="dvBtn" class="btn alt sm" hidden>🛵 设定 Delyva 通知</button><span id="dvSt" class="mut"></span></div>
    <div class="tabs" id="tabs"></div><div id="list"></div></div><div id="sumView" hidden></div><div id="staffView" hidden></div><div id="m86View" hidden></div>`;
  $("viewBtn").hidden=false; $("viewBtn").onclick=()=>setView(view==="summary"?"orders":"summary");
  $("of").onchange=e=>{ outletF=e.target.value; render(); };
  /* Delyva 连线状态：显示在提示音按钮旁边，方便排查（还没部署 web-delyva 就当没有外送功能） */
  fn("status").then(r=>{ dcfg=r; if(r&&r.configured&&role==="admin") $("dvBtn").hidden=false;
      $("dvSt").textContent = r&&r.configured ? `🛵 Delyva 已连接（${r.company||"-"}${r.secret?"":"，未设 API Secret"} · 程序版本 ${r.version||"旧版"}）` : "🛵 Delyva：还没填 API Key / Customer ID"; render(); })
    .catch(e=>{ dcfg=null; $("dvSt").textContent="🛵 Delyva 未连接："+String(e.message||e).slice(0,80); });
  $("dvBtn").onclick=async()=>{ if(!confirm("在 Delyva 登记状态通知网址？（只需要做一次，换 key 后再做一次）")) return;
    try{ const r=await fn("setup_webhook"); alert("完成 ✅\n新登记："+(r.added.join(", ")||"无（已经登记过）")+"\n网址："+r.url); }catch(e){ alert("失败："+e.message); } };
  $("sndBtn").onclick=async()=>{ unlockSound(); await loadRing(); setTimeout(()=>{ updSoundBtn(); beep(); },60); }; updSoundBtn();
  pushRender(); pushSync(); loadRing();
  await load(); timer=setInterval(load,5000);

  const q=c=>sb.from("web_orders").select(c).gte("created_at",since).order("created_at",{ascending:false}).limit(300);
  let {data, error} = await q(hasCourierCols?COLS+COLS_DEL+(hasDoneCols?COLS_DONE:"")+(hasPayCols?COLS_PAY:""):COLS);
  if(error&&hasPayCols&&/pay_|paid_|column|42703/i.test(error.message+error.code)){ hasPayCols=false; ({data, error} = await q(hasCourierCols?COLS+COLS_DEL+(hasDoneCols?COLS_DONE:""):COLS)); }   /* 还没跑 hitpay.sql */

  if(error&&hasCourierCols&&/column|42703/i.test(error.message+error.code)){ hasCourierCols=false; ({data, error} = await q(COLS)); }   /* 还没跑 delivery.sql */
  if(error){ if($("list")) $("list").innerHTML=`<div class="err">读取失败：${esc(error.message)}</div>`; return; }

async function pushEnable(){   /* 一定要在按钮点击里呼叫（浏览器规定：权限询问要有人点按钮） */
  const perm = Notification.permission==="granted" ? "granted" : await Notification.requestPermission();
  if(perm!=="granted") return;
  if(!pushKey){ let r; try{ r=await fnPush({action:"status"}); }catch(e){ throw new Error("后台还没设定好手机通知（老板要先部署 web-push 函数）"); } if(!r||!r.configured||!r.publicKey) throw new Error("后台还没设定推送密钥（WEB_VAPID_PUBLIC / WEB_VAPID_PRIVATE）"); pushKey=r.publicKey; }
  const reg=await navigator.serviceWorker.ready; let sub=await reg.pushManager.getSubscription();
  if(sub){ const k=sub.options&&sub.options.applicationServerKey?Array.from(new Uint8Array(sub.options.applicationServerKey)).join():"", want=Array.from(b64u2u8(pushKey)).join(); if(k!==want){ await sub.unsubscribe(); sub=null; } }   /* 密钥换过了：重新订阅 */
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u2u8(pushKey)});
  await fnPush({action:"subscribe",sub:sub.toJSON(),ua:navigator.userAgent});
}

/* 缩小到最长边 1280px、JPEG，并在底部印上「参考号 · 分店 · 时间」（防止拿旧照片来充数） */
async function shrink(file,label){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("读不到这张照片")); i.src=url; });
    const sc=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight)), c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(img.naturalWidth*sc)); c.height=Math.max(1,Math.round(img.naturalHeight*sc));
    const x=c.getContext("2d"); x.drawImage(img,0,0,c.width,c.height);
    const fs=Math.max(14,Math.round(c.width/42)), pad=Math.round(fs*.5);
    x.fillStyle="rgba(0,0,0,.55)"; x.fillRect(0,c.height-fs-pad*2,c.width,fs+pad*2);
    x.fillStyle="#fff"; x.font=`bold ${fs}px sans-serif`; x.textBaseline="middle"; x.fillText(label,pad,c.height-pad-fs/2);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.72)); if(!blob) throw new Error("照片处理失败");
    return blob;
  } finally { URL.revokeObjectURL(url); }
}
async function uploadShot(file,id){
  const o=orders.find(x=>x.id===id); if(!o||!file) return;
  shotBusy.add(id); render();
  try{
    const now=new Date().toISOString(), blob=await shrink(file,`${o.ref} · ${o.outlet||""} · ${klDay(now)} ${klHM(now)}`);
    const path=`${id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
    const up=await sb.storage.from("web-proof").upload(path,blob,{contentType:"image/jpeg",upsert:false}); if(up.error) throw up.error;
    const ins=await sb.from("web_order_proofs").insert({order_id:id,path}); if(ins.error) throw ins.error;
  }catch(e){ alert("照片上传失败："+(e&&e.message||e)+"\n（如果一直失败，请告诉老板检查 verify-refund.sql 有没有跑）"); }
  shotBusy.delete(id); await load();
}
$("shotIn").onchange=()=>{ const f=$("shotIn").files&&$("shotIn").files[0], id=shotFor; shotFor=0; if(f&&id) uploadShot(f,id); };

    <label class="rl">原因（必填，会记录）</label><select id="rf_rs">${REASONS.map(x=>`<option>${esc(x)}</option>`).join("")}</select>

    <div class="err" id="rf_err"></div>

    <button class="btn alt" id="rf_x" style="width:100%;border-color:var(--line);color:var(--mut)">取消</button></div>`;
  document.body.appendChild(d);

    if(!(amt>0)||amt>left+0.001){ $("rf_err").textContent=`金额要在 0.01 到 ${left.toFixed(2)} 之间`; return; }
    if(!confirm(mode==="hitpay"?`确定用 HitPay 退款 ${money(amt)} 给客人（订单 ${o.ref}）？\n退款送出后不能撤回。`:`确定记录「已手动退款 ${money(amt)}」（订单 ${o.ref}）？\n这只是登记，系统不会动任何钱。`)) return;
    d.querySelectorAll("button").forEach(x=>x.disabled=true); $("rf_err").textContent="处理中…";

    catch(e){ d.querySelectorAll("button").forEach(x=>x.disabled=false); $("rf_err").textContent=e.message; }

async function doneAct(b){
  const on=b.dataset.done==="1";
  if(on&&hasProof&&!(proofs[+b.dataset.id]||[]).length){ alert("请先拍照上传出餐照片，再按完成。\n（在订单上的「📸 拍照上传」）"); return; }

  b.disabled=true;
  const {error}=await sb.from("web_orders").update(on?{completed_at:new Date().toISOString(),completed_by:me.email}:{completed_at:null,completed_by:null}).eq("id",+b.dataset.id).eq("status","paid");

async function act(b){
  /* 2026-11-02：已收款只能由 HitPay 付款通知自动确认（数据库也挡着：supabase/lock-paid.sql）。后台只剩「取消」 */
  if(b.dataset.act!=="rejected") return;
  if(!confirm(`确定取消订单 ${b.dataset.ref}？客人的网页会显示「未能确认付款」。`)) return;

      <div class="outs">${r.role==="admin"?"全部分店":"分店："+esc(oname(r.outlets)||"—")}${r.note?" · "+esc(r.note):""}</div></div>`).join("")}</div>`;
  $("sf_role").onchange=ev=>{ $("sf_outs").hidden=ev.target.value==="admin"; };
  if($("sf_cancel")) $("sf_cancel").onclick=()=>{ staffEdit=null; staffDraw(); };
  v.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{ const r=staffRows.find(x=>x.email===b.dataset.ed); if(!r) return;
    staffEdit={old:true,email:r.email,role:r.role,outlets:(r.outlets||[]).map(Number),note:r.note||""}; staffDraw(); window.scrollTo({top:0,behavior:"smooth"}); });
  v.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(!confirm(`移除 ${b.dataset.del}？\n他之后就不能再登录员工后台。`)) return;
    const {error}=await sb.rpc("web_staff_delete",{p_email:b.dataset.del}); if(error){ alert("移除失败："+error.message); return; } staffEdit=null; staffLoad(); });
  $("sf_save").onclick=async()=>{
    const em=$("sf_em").value.trim().toLowerCase(), rl=$("sf_role").value, os=[...v.querySelectorAll(".ochk input:checked")].map(x=>+x.value), note=$("sf_note").value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ $("sf_err").textContent="请填正确的邮箱"; return; }
    if(rl==="manager"&&!os.length){ $("sf_err").textContent="分店经理要至少选一间分店"; return; }
    if(rl==="admin"&&!confirm(`把 ${em} 设成「管理员」？\n管理员看得到全部分店的销售，也能加/改/移除店员。`)) return;
    $("sf_save").disabled=true;
    const {error}=await sb.rpc("web_staff_save",{p_email:em,p_role:rl,p_outlets:os,p_note:note});
    $("sf_save").disabled=false;
    if(error){ $("sf_err").textContent="保存失败："+(/yourself/.test(error.message)?"不能修改自己的账号":error.message); return; }
    staffEdit=null; staffLoad(); };
}
function renderSummaryShell(){
  $("sumView").innerHTML=`<div class="bar"><input type="month" id="smon" value="${esc(sumMonth)}" style="width:auto">
      <select id="sout">${(()=>{ const outs=S.outlets||[], mine=role==="admin"?outs:outs.filter((o,i)=>myOutlets.includes(i));
        return (mine.length>1||role==="admin"?`<option value="">${role==="admin"?"全部分店":"我的全部分店"}</option>`:"")+mine.map(o=>`<option ${o.name===sumOutlet?"selected":""}>${esc(o.name)}</option>`).join(""); })()}</select>
      <button class="btn alt sm" id="sref">🔄 刷新</button><button class="btn sm" id="scsv">⬇ 导出 CSV</button></div>
    <div class="live" style="margin-bottom:10px">按吉隆坡时间的下单日期分月。营业额 = 已收款（含已完成）的订单金额；待确认、已拒绝的不算。随时打开都是最新的，不用等月底。</div>
    <div id="sbody"><div class="empty">读取中…</div></div>`;
  $("smon").onchange=e=>{ sumMonth=e.target.value||klMonth(); loadSummary(); };
  $("sout").onchange=e=>{ sumOutlet=e.target.value; drawSummary(); };
  $("sref").onclick=()=>loadSummary();
  $("scsv").onclick=()=>exportCsv();
}
async function loadSummary(){
  if(!/^\d{4}-\d{2}$/.test(sumMonth)) return;
  const [y,m]=sumMonth.split("-").map(Number), nx=m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,"0")}`;
  const from=`${sumMonth}-01T00:00:00+08:00`, to=`${nx}-01T00:00:00+08:00`;
  const cols=COLS+(hasCourierCols?",courier_order_id,courier_status,courier_fee":"")+(hasDoneCols?COLS_DONE:"")+(hasPayCols?",pay_provider,pay_fees,pay_method":"");
  $("sbody").innerHTML=`<div class="empty">读取中…</div>`;
  const all=[];
  for(let i=0;i<20000;i+=1000){
    const {data,error}=await sb.from("web_orders").select(cols).gte("created_at",from).lt("created_at",to).order("created_at",{ascending:true}).range(i,i+999);
    if(error){ $("sbody").innerHTML=`<div class="err">读取失败：${esc(error.message)}</div>`; return; }
    all.push(...data); if(data.length<1000) break;
  }
  sumRows=all; sumRefunds=[];
  if(hasRefund){   /* 退款按「退款那天」算进那个月；连着订单一起读（分店筛选要用） */
    const r=await sb.from("web_refunds").select("order_id,amount,reason,mode,status,created_at,created_by,web_orders(ref,outlet)").in("status",["done","manual"]).gte("created_at",from).lt("created_at",to).order("created_at",{ascending:true}).limit(2000);
    if(r.error){ if(noTable(r.error)) hasRefund=false; } else sumRefunds=r.data||[];
  }
  drawSummary();
}
const num = s => Number(String(s).replace(/,/g,""))||0;
/* 客人备注（2026-10-31 业主：后台要一眼看到）：整单的「备注 / 配送说明」+ 每道菜的口味要求（讯息里 [ ] 那段），放在订单内容上面、黄色框 */
function custNotes(msg){
  const out={note:"",items:[]};
  String(msg||"").split("\n").forEach(l=>{ l=l.trim(); let m;
    if((m=l.match(/^(备注|配送说明|Remarks?|Delivery instructions)\s*[:：]\s*(.+)$/i))&&m[2].trim()) out.note=(out.note?out.note+" / ":"")+m[2].trim();
    else if((m=l.match(/^•\s*(.+?)\s*\[([^\]]+)\]\s*x(\d+)/))) out.items.push({name:m[1].trim(),req:m[2].trim(),q:m[3]});
  });
  return out;
}
function notesHTML(o){
  const n=custNotes(o.message); if(!n.note&&!n.items.length) return "";
  return `<div class="cnote"><b>📝 客人备注</b>${n.note?`<div class="cn1">${esc(n.note)}</div>`:""}${n.items.map(i=>`<div class="cn2">• ${esc(i.name)} ×${esc(i.q)}：<b>${esc(i.req)}</b></div>`).join("")}</div>`;
}
function parseMsg(msg){
  const r={items:[],sst:0,fee:0,disc:0};
  String(msg||"").split("\n").forEach(l=>{ l=l.trim();
    let m=l.match(/^•\s*(.+?)\s+x(\d+)\s*=\s*RM\s*([\d.,]+)/);
    if(m){ r.items.push({name:m[1].replace(/\s*\[[^\]]*\]/g,"").trim(),q:+m[2],amt:num(m[3])}); return; }
    if(/^SST/i.test(l)&&(m=l.match(/RM\s*([\d.,]+)/))){ r.sst+=num(m[1]); return; }
    if(/^(运费|Delivery fee)\s*:/i.test(l)){ m=l.match(/RM\s*([\d.,]+)/); r.fee+=m?num(m[1]):0; return; }
    if(/^(优惠码|Voucher)\s*:/i.test(l)&&(m=l.match(/[−-]\s*RM\s*([\d.,]+)/))) r.disc+=num(m[1]);
  });
  return r;
}
function sumData(){
  const rows=sumRows.filter(o=>!sumOutlet||o.outlet===sumOutlet), paid=rows.filter(o=>o.status==="paid");
  const D={rows,paid,rev:0,sst:0,fee:0,disc:0,cost:0,done:0,hp:0,hpFees:0,pend:rows.filter(o=>o.status==="pending").length,rej:rows.filter(o=>o.status==="rejected").length,
    type:{pickup:[0,0],delivery:[0,0]},outlet:{},day:{},items:{}};
  paid.forEach(o=>{ const a=+o.amount||0, p=parseMsg(o.message), t=o.order_type==="delivery"?"delivery":"pickup";
    D.rev+=a; D.sst+=p.sst; D.fee+=p.fee; D.disc+=p.disc; if(isDone(o)) D.done++;
    if(o.courier_order_id&&o.courier_status!==900) D.cost+=+o.courier_fee||0;
    if(o.pay_provider==="hitpay"){ D.hp++; D.hpFees+=+o.pay_fees||0; }
    D.type[t][0]++; D.type[t][1]+=a;
    const ou=D.outlet[o.outlet||"-"]=D.outlet[o.outlet||"-"]||[0,0]; ou[0]++; ou[1]+=a;
    const dy=D.day[klDay(o.created_at)]=D.day[klDay(o.created_at)]||[0,0]; dy[0]++; dy[1]+=a;
    p.items.forEach(it=>{ const x=D.items[it.name]=D.items[it.name]||[0,0]; x[0]+=it.q; x[1]+=it.amt; });
  });
  D.refunds=sumRefunds.filter(r=>!sumOutlet||(r.web_orders&&r.web_orders.outlet===sumOutlet)); D.refund=D.refunds.reduce((t,r)=>t+(+r.amount||0),0);
  return D;
}
function drawSummary(){
  if(!$("sbody")) return; const D=sumData(), n=D.paid.length;
  const kpi=(l,v,sm)=>`<div class="kpi"><span>${l}</span><b>${v}</b>${sm?`<small>${sm}</small>`:""}</div>`;
  const tbl=(head,rows)=>`<div class="tblw"><table class="tbl"><tr>${head.map((h,i)=>`<th${i?' class="n"':""}>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i?' class="n"':""}>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
  if(!D.rows.length){ $("sbody").innerHTML=`<div class="empty">${esc(sumMonth)} 还没有订单</div>`; return; }
  const top=Object.entries(D.items).sort((a,b)=>b[1][0]-a[1][0]||b[1][1]-a[1][1]).slice(0,15);
  $("sbody").innerHTML=`<div class="kpis">
      ${kpi("营业额（已收款）",money(D.rev),`${n} 张订单`)}${kpi("平均每单",money(n?D.rev/n:0))}
      ${D.refund>0?kpi("退款",money(D.refund),`${D.refunds.length} 笔 · 净营业额 ${money(D.rev-D.refund)}`):""}
      ${kpi("已完成",D.done,`还没完成 ${n-D.done}`)}${kpi("待确认 / 已拒绝",`${D.pend} / ${D.rej}`)}
      ${kpi("SST（含在营业额里）",money(D.sst))}${kpi("向客人收的运费",money(D.fee))}
      ${kpi("Delyva 骑手成本",money(D.cost),"已取消的不算")}${kpi("优惠折扣",money(D.disc))}
      ${D.hp?kpi("HitPay 手续费",money(D.hpFees),`${D.hp} 张网上付款，店家吸收`):""}</div>
    ${D.refunds.length?`<div class="sumsec"><h3>退款记录（${D.refunds.length}）</h3>${tbl(["订单","退款时间","金额","方式","原因"],D.refunds.slice().reverse().map(r=>[esc((r.web_orders&&r.web_orders.ref)||"-"),esc(klDay(r.created_at)+" "+klHM(r.created_at)),money(r.amount),r.mode==="manual"?"手动":"HitPay",esc(r.reason)]))}</div>`:""}
    <div class="sumsec"><h3>自取 / 外送</h3>${tbl(["类型","订单","营业额"],[["🛍️ 自取",D.type.pickup[0],money(D.type.pickup[1])],["🛵 外送",D.type.delivery[0],money(D.type.delivery[1])]])}</div>
    ${sumOutlet?"":`<div class="sumsec"><h3>按分店</h3>${tbl(["分店","订单","营业额"],Object.entries(D.outlet).sort((a,b)=>b[1][1]-a[1][1]).map(([k,v])=>[esc(k),v[0],money(v[1])]))}</div>`}
    <div class="sumsec"><h3>热卖 Top 15</h3>${top.length?tbl(["菜品","份数","金额"],top.map(([k,v])=>[esc(k),v[0],money(v[1])])):`<div class="live">没有菜品资料</div>`}</div>
    <div class="sumsec"><h3>每天</h3>${tbl(["日期","订单","营业额"],Object.entries(D.day).sort().map(([k,v])=>[k,v[0],money(v[1])]))}</div>
    <div class="sumsec"><h3>订单列表（${D.rows.length}）</h3>${tbl(["参考号","时间","分店","类型","金额","付款方式","运费","手续费","状态"],D.rows.slice().reverse().map(o=>[esc(o.ref),esc(klDay(o.created_at)+" "+klHM(o.created_at)),esc(o.outlet||"-"),o.order_type==="delivery"?"外送":"自取",money(o.amount),...payCells(o),isDone(o)?"已完成":o.status==="paid"?"已收款":o.status==="pending"?"待确认":"已拒绝"]))}</div>`;
}
/* 订单列表「付款 · 运费 · 手续费」：例如「DuitNow · 运费 RM 5.00 · 手续费 RM 0.45 (1.2%)」；运费 = 向客人收的运费（订单讯息里那行） */
const payName = o => o.pay_provider==="hitpay" ? (PAYM[o.pay_method]||o.pay_method||"HitPay") : o.pay_provider ? String(o.pay_provider) : (o.status==="paid"?"转账（人工确认）":"");
const feePct = o => (+o.pay_fees>0 && +o.amount>0) ? (o.pay_fees/o.amount*100).toFixed(1)+"%" : "";
/* 订单列表：付款方式 / 运费 / 手续费 分三栏（2026-10-31 业主：标题已写，格子里不重复「运费」「手续费」字眼） */
function payCells(o){
  const nm=o.status==="paid"?payName(o):"";
  const fee=o.order_type==="delivery"?money(parseMsg(o.message).fee):"";
  const hf=+o.pay_fees>0?`${money(o.pay_fees)} (${feePct(o)})`:"";
  return [esc(nm)||"—", fee||"—", hf||"—"];
}
function exportCsv(){
  const D=sumData(); if(!D.rows.length){ alert("这个月没有订单"); return; }
  const cell=v=>{ let t=String(v==null?"":v); if(/^[=+\-@\t\r]/.test(t)) t="'"+t; return '"'+t.replace(/"/g,'""')+'"'; };   /* 防 Excel 公式注入 */
  const lines=[["参考号","日期","时间","分店","类型","状态","金额","付款方式","手续费","手续费%","SST","运费","优惠","骑手成本","客人","电话","备注","菜品"].map(cell).join(",")];
  D.rows.forEach(o=>{ const p=parseMsg(o.message);
    lines.push([o.ref,klDay(o.created_at),klHM(o.created_at),o.outlet,o.order_type==="delivery"?"外送":"自取",isDone(o)?"已完成":o.status==="paid"?"已收款":o.status==="pending"?"待确认":"已拒绝",
      (+o.amount).toFixed(2),o.status==="paid"?payName(o):"",+o.pay_fees>0?(+o.pay_fees).toFixed(2):"",feePct(o),p.sst.toFixed(2),p.fee.toFixed(2),p.disc.toFixed(2),o.courier_order_id&&o.courier_status!==900?(+o.courier_fee||0).toFixed(2):"",o.customer_name,o.customer_phone,custNotes(o.message).note,
      p.items.map(i=>`${i.name} x${i.q}`).join("; ")].map(cell).join(",")); });
  const b=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}), u=URL.createObjectURL(b), a=document.createElement("a");
  a.href=u; a.download=`MengKee-${sumMonth}${sumOutlet?"-"+sumOutlet:""}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),30000);
}
