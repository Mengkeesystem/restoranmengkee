<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>店员后台 · 付款确认</title>
<link rel="icon" href="images/logo.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'none'">
<script>document.write('<script src="config.js?v='+Math.floor(Date.now()/60000)+'"><\/script>');</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<style>
:root{--p:#B4232A;--a:#F2B417;--dk:#2A1A14;--bg:#FFFBF5;--tx:#2A1A14;--mut:#7A6A60;--line:#E3D3C2;--ok:#1F8A4C;--r:3px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:3px solid var(--a);display:flex;align-items:center;gap:10px;padding:10px 16px}
header img{height:36px}
header b{color:var(--p);font-size:17px}
header .sp{flex:1}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.btn{border:0;border-radius:var(--r);padding:10px 16px;font-weight:800;font-size:15px;cursor:pointer;min-height:42px;background:var(--p);color:#fff;font-family:inherit}
.btn.alt{background:#fff;color:var(--p);border:2px solid var(--p)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.5}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:3px 3px 0 rgba(180,35,42,.10)}
input,select{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);font-family:inherit;background:#fff}
label{font-weight:700;font-size:14px;display:block;margin:10px 0 4px}
.err{color:var(--p);min-height:20px;font-size:14px;margin-top:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:#fff;padding:8px 14px;font-weight:800;border-radius:var(--r);cursor:pointer;font-family:inherit;font-size:14px}
.tabs button.on{background:var(--p);border-color:var(--p);color:#fff}
.tabs .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;background:var(--a);color:var(--dk);border-radius:2px;font-size:12px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar select{width:auto;min-width:200px}
.live{font-size:13px;color:var(--mut)}
.live i{display:inline-block;width:8px;height:8px;background:var(--ok);border-radius:50%;margin-right:6px;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}
.ord{background:#fff;border:1px solid var(--line);border-left:6px solid var(--a);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:3px 3px 0 rgba(180,35,42,.08)}
.ord.paid{border-left-color:var(--ok)}
.ord.rejected{border-left-color:#999;opacity:.8}
.ord.new{animation:flash 1.2s 3}
@keyframes flash{50%{background:#FFF3C4}}
.oh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ref{font-size:20px;font-weight:900;letter-spacing:1px}
.amt{font-size:26px;font-weight:900;color:var(--p);white-space:nowrap}
.meta{font-size:14px;color:var(--mut);margin-top:4px}
.meta b{color:var(--tx)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:2px;margin-left:6px;vertical-align:middle}
.tag.pending{background:#FFF0C2;color:#8A5A00}.tag.paid{background:#E2F5E9;color:var(--ok)}.tag.rejected{background:#eee;color:#666}.tag.done{background:#DDEBFF;color:#1F4E9A}.tag.old{background:#FDE2E2;color:var(--p)}
details{margin-top:8px}
summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--p)}
pre{white-space:pre-wrap;word-break:break-word;background:#FFFBF0;border:1px solid var(--line);padding:10px;font-size:13.5px;margin:8px 0 0;font-family:inherit}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:140px}
.who{font-size:12px;color:var(--mut);margin-top:6px}
.cour{margin-top:10px;padding:10px;border:1px dashed var(--line);background:#FFFDF6;font-size:14px}.cour .mut,.mut{color:var(--mut);font-size:13px}.cour .acts{margin-top:8px}.cour .err{margin-top:4px}
.sim{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:8px;border-top:1px dashed var(--line)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.hint{background:#FFF6DA;border:1px solid var(--a);padding:10px 12px;font-size:14px;margin-bottom:12px}
</style>
</head>
<body>
<header><img src="images/logo.png" alt=""><b id="hTitle">店员后台 · 付款确认</b><span class="sp"></span><a class="btn alt sm" href="check.html" style="text-decoration:none;display:inline-flex;align-items:center">🔍 订单核对</a><span id="hUser" class="live"></span><button class="btn alt sm" id="logoutBtn" hidden>登出</button></header>
<div class="wrap" id="app"></div>

<script>
(function(){
"use strict";
const S = window.SITE || {}, B = S.backend || {};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const money = n => "RM " + (Math.round((+n)*100)/100).toFixed(2);
const app = $("app");
document.title = (S.name||"") + " · 店员后台";
$("hTitle").textContent = (S.name||"") + " · 付款确认";

if(!B.supabaseUrl || !B.supabaseAnonKey || !window.supabase){
  app.innerHTML = `<div class="card"><h2 style="margin-top:0;color:var(--p)">后台还没设定</h2><p>请先照 README「付款确认小后台」的步骤建好 Supabase 项目，并把网址和 anon key 填进 <code>config.js</code> 的 <code>backend</code>。</p></div>`;
  return;
}
const sb = window.supabase.createClient(B.supabaseUrl, B.supabaseAnonKey);
let me=null, tab="pending", outletF="", orders=[], seen=new Set(), first=true, timer=null;

/* 提示音（新订单） */
/* 新订单提示音：清脆的「叮～当」两声（像小铃铛，不刺耳）。
   浏览器规定要先点过页面才能出声，所以用同一个 AudioContext，第一次点击就解锁；没解锁时页面上有「🔔 开启提示音」按钮。 */
let actx=null;
function audioCtx(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function soundOn(){ return !!(actx&&actx.state==="running"); }
function unlockSound(){ const c=audioCtx(); if(c&&c.state!=="running") c.resume().then(updSoundBtn,updSoundBtn); else updSoundBtn(); }
function bell(c,t0,f,vol){   /* 一个铃声：基音 + 两个泛音，快速起音、慢慢消失 */
  [[1,1],[2.76,.32],[5.4,.12]].forEach(([m,a])=>{ const o=c.createOscillator(),g=c.createGain(); o.type="sine"; o.frequency.value=f*m;
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol*a,t0+.008); g.gain.exponentialRampToValueAtTime(.0001,t0+(m===1?1.4:.6));
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+1.5); });
}
function beep(){ try{ const c=audioCtx(); if(!c) return; if(c.state!=="running") c.resume(); const t=c.currentTime+.05; bell(c,t,1318.5,.16); bell(c,t+.28,1046.5,.14); }catch(e){} }
function updSoundBtn(){ const b=$("sndBtn"); if(!b) return; const on=soundOn(); b.textContent=on?"🔔 提示音已开启 · 试听":"🔕 点这里开启提示音"; b.className="btn sm "+(on?"alt":""); }
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,unlockSound,{passive:true}));

function loginView(msg){
  $("logoutBtn").hidden=true; $("hUser").textContent="";
  app.innerHTML = `<div class="card" style="max-width:420px;margin:30px auto">
    <h2 style="margin-top:0;color:var(--p)">店员登录</h2>
    <label>邮箱</label><input id="em" type="email" autocomplete="username">
    <label>密码</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="lerr">${esc(msg||"")}</div>
    <button class="btn" id="lbtn" style="width:100%;margin-top:6px">登录</button>
    <p class="live" style="margin-top:14px">账号由老板在 Supabase 后台建立，并加入店员白名单才能使用。</p></div>`;
  const go=async()=>{ $("lbtn").disabled=true; $("lerr").textContent="";
    const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
    $("lbtn").disabled=false; if(error){ $("lerr").textContent="登录失败："+error.message; return; } boot(); };
  $("lbtn").onclick=go; $("pw").onkeydown=e=>{ if(e.key==="Enter") go(); };
}

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ loginView(); return; }
  me=session.user;
  const {data:ok, error} = await sb.rpc("is_web_staff");
  if(error||!ok){ await sb.auth.signOut(); loginView("这个账号不在店员白名单里，请联络老板。"); return; }
  $("hUser").textContent=me.email; $("logoutBtn").hidden=false;
  $("logoutBtn").onclick=async()=>{ clearInterval(timer); await sb.auth.signOut(); loginView(); };
  app.innerHTML = `<div class="hint">🔔 请保持这个页面开着（声音打开）。有新订单会响铃。<b>先在收款机 / MAE / 银行 App 核对收到的金额，再按「已收款」</b>，客人的网页会显示「店家已确认」。客人不会另外发 WhatsApp，订单内容就在下面。</div>
    <div class="bar"><select id="of"><option value="">全部分店</option>${(S.outlets||[]).map(o=>`<option>${esc(o.name)}</option>`).join("")}</select><span class="live"><i></i>自动更新中（每 5 秒）</span><button type="button" id="sndBtn" class="btn sm">🔕 点这里开启提示音</button><button type="button" id="dvBtn" class="btn alt sm" hidden>🛵 设定 Delyva 通知</button><span id="dvSt" class="mut"></span></div>
    <div class="tabs" id="tabs"></div><div id="list"></div>`;
  $("of").onchange=e=>{ outletF=e.target.value; render(); };
  /* Delyva 连线状态：显示在提示音按钮旁边，方便排查（还没部署 web-delyva 就当没有外送功能） */
  fn("status").then(r=>{ dcfg=r; if(r&&r.configured) $("dvBtn").hidden=false;
      $("dvSt").textContent = r&&r.configured ? `🛵 Delyva 已连接（${r.company||"-"}${r.secret?"":"，未设 API Secret"} · 程序版本 ${r.version||"旧版"}）` : "🛵 Delyva：还没填 API Key / Customer ID"; render(); })
    .catch(e=>{ dcfg=null; $("dvSt").textContent="🛵 Delyva 未连接："+String(e.message||e).slice(0,80); });
  $("dvBtn").onclick=async()=>{ if(!confirm("在 Delyva 登记状态通知网址？（只需要做一次，换 key 后再做一次）")) return;
    try{ const r=await fn("setup_webhook"); alert("完成 ✅\n新登记："+(r.added.join(", ")||"无（已经登记过）")+"\n网址："+r.url); }catch(e){ alert("失败："+e.message); } };
  $("sndBtn").onclick=()=>{ unlockSound(); setTimeout(()=>{ updSoundBtn(); beep(); },60); }; updSoundBtn();
  await load(); timer=setInterval(load,5000);
}

async function load(){
  const since=new Date(Date.now()-3*24*3600*1000).toISOString();
  const q=c=>sb.from("web_orders").select(c).gte("created_at",since).order("created_at",{ascending:false}).limit(300);
  let {data, error} = await q(hasCourierCols?COLS+COLS_DEL+(hasDoneCols?COLS_DONE:""):COLS);
  if(error&&hasDoneCols&&/completed_|column|42703/i.test(error.message+error.code)){ hasDoneCols=false; ({data, error} = await q(hasCourierCols?COLS+COLS_DEL:COLS)); }   /* 还没跑新版 delivery.sql（第 6 部分） */
  if(error&&hasCourierCols&&/column|42703/i.test(error.message+error.code)){ hasCourierCols=false; ({data, error} = await q(COLS)); }   /* 还没跑 delivery.sql */
  if(error){ if($("list")) $("list").innerHTML=`<div class="err">读取失败：${esc(error.message)}</div>`; return; }
  const fresh = data.filter(o=>o.status==="pending" && !seen.has(o.id));
  data.forEach(o=>seen.add(o.id));
  orders=data;
  if(!first && fresh.length){ beep(); document.title="🔔 新订单 · "+(S.name||""); setTimeout(()=>document.title=(S.name||"")+" · 店员后台",8000); }
  render(first?[]:fresh.map(o=>o.id)); first=false;
}

const COLS="id,ref,outlet,order_type,customer_name,customer_phone,amount,message,status,created_at,confirmed_at,confirmed_by";
const COLS_DEL=",outlet_idx,dest,courier_order_id,courier_tracking,courier_service,courier_fee,courier_status,courier_rider,courier_error,courier_updated_at";
const COLS_DONE=",completed_at,completed_by";
let hasCourierCols=true, hasDoneCols=true, dcfg=null, busy=new Set();
/* 已完成：店员按了「完成」，或 Delyva 通知已送达（700/1000） */
const isDone = o => o.status==="paid" && (!!o.completed_at || o.courier_status===700 || o.courier_status===1000);
const tabOf = o => isDone(o) ? "done" : o.status;
/* Delyva 状态代码（照官方插件） */
const DSTAT={100:"已叫车，等骑手接单",110:"已叫车，等骑手接单",200:"骑手已接单",400:"骑手前往取餐",475:"⚠️ 取餐失败",500:"已取餐",600:"配送中",650:"⚠️ 送达失败",700:"✅ 已送达",1000:"✅ 已完成",900:"已取消"};
async function fn(action,id,extra){
  const {data,error}=await sb.functions.invoke("web-delyva",{body:{action,id,...(extra||{})}});
  if(error){ let m=error.message; try{ const j=await error.context.json(); if(j&&j.error) m=j.error; }catch(e){} throw new Error(m); }
  return data;
}
function courierHTML(o){
  if(o.order_type!=="delivery"||o.status!=="paid"||!hasCourierCols) return "";
  if(!o.dest) return `<div class="cour"><span class="mut">🛵 这张单没有送餐坐标（旧订单），请手动叫车。</span></div>`;
  const d=o.dest, map=`https://www.google.com/maps?q=${encodeURIComponent(d.lat+","+d.lng)}`;
  const addr=`<div class="mut">📍 ${esc(d.unit?d.unit+", ":"")}${esc(d.address||"")} · <a href="${map}" target="_blank" rel="noopener">地图</a>${d.km?` · 约 ${esc(d.km)} km`:""}${d.note?`<br>📝 ${esc(d.note)}`:""}</div>`;
  const b=busy.has(o.id);
  if(!o.courier_order_id||o.courier_status===900){
    return `<div class="cour">${addr}${o.courier_status===900?`<div class="mut">Delyva：已取消</div>`:""}${o.courier_error?`<div class="err">叫车失败：${esc(o.courier_error)}</div>`:""}
      <div class="acts"><button class="btn sm" data-cour="dispatch" data-id="${o.id}" ${b?"disabled":""}>${b?"叫车中…":"🛵 叫骑手（Delyva）"}</button></div></div>`;
  }
  const r=o.courier_rider||{}, trk=o.courier_tracking&&dcfg&&dcfg.company?`https://${encodeURIComponent(dcfg.company)}.delyva.app/customer/strack?trackingNo=${encodeURIComponent(o.courier_tracking)}`:"";
  return `<div class="cour">${addr}<div><b>🛵 ${esc(DSTAT[o.courier_status]||("状态 "+(o.courier_status??"-")))}</b>${o.courier_service?` · ${esc(o.courier_service)}`:""}${o.courier_fee?` · 运费成本 ${money(o.courier_fee)}`:""}</div>
    ${r.name||r.phone?`<div class="mut">骑手：${esc(r.name||"")} ${r.phone?`· <a href="tel:${esc(String(r.phone).replace(/[^\d+]/g,""))}">${esc(r.phone)}</a>`:""} ${r.plate?`· ${esc(r.plate)}`:""}</div>`:""}
    <div class="mut">Delyva 单号 ${esc(o.courier_order_id)}${trk?` · <a href="${trk}" target="_blank" rel="noopener">追踪</a>`:""}</div>
    ${o.courier_error?`<div class="err">${esc(o.courier_error)}</div>`:""}
    ${(o.courier_status||0)<500?`<div class="acts"><button class="btn alt sm" data-cour="cancel" data-id="${o.id}" ${b?"disabled":""}>取消骑手</button></div>`:""}
    ${dcfg&&String(dcfg.company).toLowerCase()==="trydx"?`<div class="sim"><span class="mut">🧪 测试账号模拟骑手：</span>${[[200,"接单"],[400,"前往取餐"],[500,"已取餐"],[600,"配送中"],[700,"送达"],[650,"送达失败"]].map(([c,l])=>`<button class="btn alt sm" data-sim="${c}" data-id="${o.id}" ${b?"disabled":""}>${l}</button>`).join("")}</div>`:""}</div>`;
}
async function courAct(b){
  const id=+b.dataset.id, a=b.dataset.cour;
  if(a==="cancel"&&!confirm("确定取消这张单的 Delyva 骑手？")) return;
  busy.add(id); render();
  try{ await fn(a,id); }catch(e){ alert((a==="cancel"?"取消失败：":"叫车失败：")+e.message); }
  busy.delete(id); await load();
}

function ago(ts){ const m=Math.floor((Date.now()-new Date(ts))/60000); return m<1?"刚刚":m<60?m+" 分钟前":Math.floor(m/60)+" 小时前"; }
function hhmm(ts){ const d=new Date(ts); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

function render(newIds){
  newIds=newIds||[];
  const list=orders.filter(o=>!outletF||o.outlet===outletF);
  const cnt={pending:0,paid:0,done:0,rejected:0}; list.forEach(o=>cnt[tabOf(o)]++);
  $("tabs").innerHTML=[["pending","待确认"],["paid","已收款"],["done","已完成"],["rejected","已拒绝"]].map(([k,l])=>`<button class="${tab===k?"on":""}" data-k="${k}">${l}<span class="n">${cnt[k]}</span></button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{ tab=b.dataset.k; render(); });
  const rows=list.filter(o=>tabOf(o)===tab);
  $("list").innerHTML = rows.length? rows.map(o=>{
    const old = o.status==="pending" && (Date.now()-new Date(o.created_at))>30*60000;
    return `<div class="ord ${o.status}${newIds.includes(o.id)?" new":""}">
      <div class="oh"><div><span class="ref">${esc(o.ref)}</span><span class="tag ${isDone(o)?"done":o.status}">${isDone(o)?"已完成":o.status==="pending"?"待确认":o.status==="paid"?"已收款":"已拒绝"}</span>${old?`<span class="tag old">超过 30 分钟</span>`:""}
        <div class="meta">${hhmm(o.created_at)}（${ago(o.created_at)}） · <b>${esc(o.outlet||"-")}</b> · ${o.order_type==="delivery"?"🛵 外送":"🛍️ 自取"}</div>
        <div class="meta">👤 <b>${esc(o.customer_name||"")}</b> · 📞 <a href="tel:${esc(String(o.customer_phone||"").replace(/[^\d+]/g,""))}">${esc(o.customer_phone||"")}</a></div></div>
        <div class="amt">${money(o.amount)}</div></div>
      <details ${o.status==="pending"?"open":""}><summary>订单内容</summary><pre>${esc(o.message)}</pre></details>
      ${o.status==="pending"?`<div class="acts"><button class="btn ok" data-act="paid" data-id="${o.id}" data-ref="${esc(o.ref)}" data-amt="${esc(money(o.amount))}">✅ 已收款</button><button class="btn alt" data-act="rejected" data-id="${o.id}" data-ref="${esc(o.ref)}" data-amt="${esc(money(o.amount))}">✖ 拒绝</button></div>`
        :`<div class="who">${o.status==="paid"?"确认":"拒绝"}：${esc(o.confirmed_by||"")} · ${o.confirmed_at?hhmm(o.confirmed_at):""}${isDone(o)?` · 完成：${esc(o.completed_by||"Delyva")}${o.completed_at?" · "+hhmm(o.completed_at):""}`:""}</div>`}
      ${o.status==="paid"&&hasDoneCols&&!isDone(o)?`<div class="acts"><button class="btn ok sm" data-done="1" data-id="${o.id}" data-ref="${esc(o.ref)}" data-del="${o.order_type==="delivery"?1:""}">✅ ${o.order_type==="delivery"?"标记完成（已送达）":"完成（客人已取餐）"}</button></div>`:""}
      ${isDone(o)&&o.completed_at&&o.completed_by&&o.completed_by!=="Delyva"&&o.courier_status!==700&&o.courier_status!==1000?`<div class="acts"><button class="btn alt sm" data-done="0" data-id="${o.id}" data-ref="${esc(o.ref)}">↩ 撤回完成</button></div>`:""}
      ${courierHTML(o)}
    </div>`; }).join("") : `<div class="empty">${tab==="pending"?"目前没有待确认的订单 ☕":"没有记录"}</div>`;
  $("list").querySelectorAll("button[data-act]").forEach(b=>b.onclick=()=>act(b));
  $("list").querySelectorAll("button[data-cour]").forEach(b=>b.onclick=()=>courAct(b));
  $("list").querySelectorAll("button[data-done]").forEach(b=>b.onclick=()=>doneAct(b));
  $("list").querySelectorAll("button[data-sim]").forEach(b=>b.onclick=async()=>{ const id=+b.dataset.id; busy.add(id); render();
    try{ await fn("simulate",id,{code:+b.dataset.sim}); }catch(e){ alert("模拟失败："+e.message); } busy.delete(id); await load(); });
}

async function doneAct(b){
  const on=b.dataset.done==="1";
  if(!confirm(on ? `订单 ${b.dataset.ref} ${b.dataset.del?"确定已送达？\n（用 Delyva 的单，送达后会自动完成，不用按）":"确定客人已取餐？"}` : `把订单 ${b.dataset.ref} 撤回「已收款」？`)) return;
  b.disabled=true;
  const {error}=await sb.from("web_orders").update(on?{completed_at:new Date().toISOString(),completed_by:me.email}:{completed_at:null,completed_by:null}).eq("id",+b.dataset.id).eq("status","paid");
  if(error){ alert("更新失败："+error.message); b.disabled=false; return; }
  await load();
}
async function act(b){
  const st=b.dataset.act, q = st==="paid"
    ? `确认已收到 ${b.dataset.amt}（参考号 ${b.dataset.ref}）？\n按确定后，客人的网页会显示「店家已确认收款」，请开始准备。`
    : `确定拒绝订单 ${b.dataset.ref}？客人的网页会显示「未能确认付款」。`;
  if(!confirm(q)) return;
  b.disabled=true;
  const {error}=await sb.from("web_orders").update({status:st,confirmed_at:new Date().toISOString(),confirmed_by:me.email}).eq("id",+b.dataset.id).eq("status","pending");
  if(error){ alert("更新失败："+error.message); b.disabled=false; return; }
  await load();
  /* 外送单：已收款后自动叫 Delyva 骑手（失败会显示在订单上，可再按「叫骑手」） */
  const o=orders.find(x=>x.id===+b.dataset.id);
  if(st==="paid"&&o&&o.order_type==="delivery"&&o.dest&&dcfg&&dcfg.configured&&!o.courier_order_id){
    busy.add(o.id); render();
    try{ await fn("dispatch",o.id); }catch(e){ alert("已收款，但自动叫骑手失败："+e.message+"\n可以在订单上按「🛵 叫骑手」再试，或手动叫车。"); }
    busy.delete(o.id); await load();
  }
}

sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT") loginView(); });
boot();
})();
</script>
